<meta name="theme-color" content="#faf6ee">
<style>
  :root {
    --bg: oklch(95% 0.022 85);
    --surface: oklch(99% 0.01 85);
    --ink: oklch(17% 0.016 60);
    --ink-soft: oklch(42% 0.02 60);
    --ink-faint: oklch(60% 0.018 60);
    --line: oklch(83% 0.02 70);
    --shadow: var(--ink);
    --brand: oklch(64% 0.19 50);
    --brand-tint: oklch(93% 0.05 55);
    --brand-ink: oklch(30% 0.09 50);
    --ok: oklch(56% 0.15 145); --ok-tint: oklch(93% 0.035 145);
    --bad: oklch(54% 0.20 25); --bad-tint: oklch(93% 0.035 25);
    --gold: oklch(78% 0.13 85); --gold-tint: oklch(95% 0.05 85); --gold-ink: oklch(42% 0.1 70);
    --c-geo: oklch(56% 0.13 165); --c-geo-tint: oklch(92% 0.035 165);
    --c-ent: oklch(58% 0.20 350); --c-ent-tint: oklch(93% 0.035 350);
    --c-his: oklch(63% 0.15 75); --c-his-tint: oklch(93% 0.04 75);
    --c-art: oklch(56% 0.18 305); --c-art-tint: oklch(92% 0.04 305);
    --c-cien: oklch(56% 0.16 235); --c-cien-tint: oklch(92% 0.035 235);
    --c-dep: oklch(58% 0.20 30); --c-dep-tint: oklch(93% 0.04 30);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(15% 0.018 60);
      --surface: oklch(20% 0.02 60);
      --ink: oklch(95% 0.012 70);
      --ink-soft: oklch(78% 0.016 70);
      --ink-faint: oklch(58% 0.016 70);
      --line: oklch(33% 0.02 70);
      --shadow: oklch(6% 0.01 60);
      --brand: oklch(74% 0.17 50);
      --brand-tint: oklch(28% 0.07 50);
      --brand-ink: oklch(90% 0.06 55);
      --ok: oklch(68% 0.16 145); --ok-tint: oklch(28% 0.05 145);
      --bad: oklch(66% 0.20 25); --bad-tint: oklch(28% 0.06 25);
      --gold: oklch(72% 0.14 85); --gold-tint: oklch(28% 0.06 85); --gold-ink: oklch(88% 0.08 80);
      --c-geo: oklch(68% 0.14 165); --c-geo-tint: oklch(28% 0.045 165);
      --c-ent: oklch(70% 0.20 350); --c-ent-tint: oklch(28% 0.045 350);
      --c-his: oklch(74% 0.15 75); --c-his-tint: oklch(28% 0.05 75);
      --c-art: oklch(68% 0.18 305); --c-art-tint: oklch(27% 0.05 305);
      --c-cien: oklch(68% 0.16 235); --c-cien-tint: oklch(27% 0.045 235);
      --c-dep: oklch(70% 0.20 30); --c-dep-tint: oklch(28% 0.05 30);
    }
  }
  :root[data-theme="dark"] {
    --bg: oklch(15% 0.018 60);
    --surface: oklch(20% 0.02 60);
    --ink: oklch(95% 0.012 70);
    --ink-soft: oklch(78% 0.016 70);
    --ink-faint: oklch(58% 0.016 70);
    --line: oklch(33% 0.02 70);
    --shadow: oklch(6% 0.01 60);
    --brand: oklch(74% 0.17 50);
    --brand-tint: oklch(28% 0.07 50);
    --brand-ink: oklch(90% 0.06 55);
    --ok: oklch(68% 0.16 145); --ok-tint: oklch(28% 0.05 145);
    --bad: oklch(66% 0.20 25); --bad-tint: oklch(28% 0.06 25);
    --gold: oklch(72% 0.14 85); --gold-tint: oklch(28% 0.06 85); --gold-ink: oklch(88% 0.08 80);
    --c-geo: oklch(68% 0.14 165); --c-geo-tint: oklch(28% 0.045 165);
    --c-ent: oklch(70% 0.20 350); --c-ent-tint: oklch(28% 0.045 350);
    --c-his: oklch(74% 0.15 75); --c-his-tint: oklch(28% 0.05 75);
    --c-art: oklch(68% 0.18 305); --c-art-tint: oklch(27% 0.05 305);
    --c-cien: oklch(68% 0.16 235); --c-cien-tint: oklch(27% 0.045 235);
    --c-dep: oklch(70% 0.20 30); --c-dep-tint: oklch(28% 0.05 30);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Work Sans', sans-serif; }
  a { color: var(--brand-ink); }
  h1, h2, .display { font-family: 'Bungee', 'Work Sans', sans-serif; font-weight: 400; text-wrap: balance; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 24px 18px 56px; }
  .word { font-family: 'Bungee', 'Work Sans', sans-serif; font-weight: 400; font-size: 21px; letter-spacing: 0.01em; }
  .word .amp { color: var(--brand); }
  .card { background: var(--surface); border: 2.5px solid var(--ink); border-radius: 14px; padding: 20px; box-shadow: 4px 4px 0 var(--shadow); }
  .btn { display: block; width: 100%; text-align: center; border-radius: 10px; padding: 14px; font-weight: 700; font-size: 15px; border: 2.5px solid var(--ink); cursor: pointer; font-family: 'Work Sans', sans-serif; background: var(--surface); color: var(--ink); box-shadow: 3px 3px 0 var(--shadow); transition: transform .08s ease, box-shadow .08s ease; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
  .btn-brand { background: var(--brand); color: var(--ink); }
  .btn-brand:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-outline { background: var(--surface); color: var(--ink); }
  .backbtn { width: 38px !important; height: 38px; padding: 0 !important; display: flex; align-items: center; justify-content: center; border-radius: 999px; flex-shrink: 0; }
  input[type=text], input[type=email], input[type=password], input[type=date], select.selinput { width: 100%; border: 2.5px solid var(--ink); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 14px 16px; font-size: 15px; font-family: 'Work Sans', sans-serif; font-weight: 600; -webkit-appearance: none; appearance: none; }
  select.selinput { background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 20px) calc(50% - 3px), calc(100% - 14px) calc(50% - 3px); background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; }
  input[type=date] { color-scheme: light; }
  label.fieldlabel { display: block; font-weight: 700; font-size: 12.5px; color: var(--ink-soft); margin: 12px 0 6px; }
  label.fieldlabel:first-child { margin-top: 0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 7px 13px; font-weight: 700; font-size: 12.5px; }
  .daypicker { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 16px; -webkit-overflow-scrolling: touch; }
  .daypill { flex-shrink: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 13px; border: 2px solid var(--line); background: var(--surface); color: var(--ink-soft); cursor: pointer; }
  .daypill.active { background: var(--brand); color: var(--ink); border-color: var(--ink); }
  .daypill.locked { opacity: 0.55; }
  .daypicker.locked .daypill:not(.active) { opacity: 0.35; pointer-events: none; }
  .qcard { background: var(--surface); border: 2.5px solid var(--ink); border-radius: 14px; padding: 14px; margin-bottom: 10px; box-shadow: 4px 4px 0 var(--shadow); }
  .qcat { font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; display: inline-block; padding: 4px 10px; border-radius: 999px; border: 2px solid currentColor; }
  .qtext { font-family: 'Bungee', 'Work Sans', sans-serif; font-weight: 400; font-size: 16px; margin-bottom: 10px; line-height: 1.35; text-wrap: balance; }
  .opt { border: 2px solid var(--line); border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 14.5px; margin-bottom: 6px; cursor: pointer; }
  .opt.selected { border-color: var(--brand); background: var(--brand-tint); color: var(--brand-ink); font-weight: 700; }
  .opt.correct { border-color: var(--ok); background: var(--ok-tint); color: var(--ok); font-weight: 800; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-tint); color: var(--bad); font-weight: 800; }
  .opt.locked { cursor: default; }
  .timerrow { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .timerpill { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; font-size: 12.5px; padding: 6px 12px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .progress { display: flex; gap: 7px; margin-bottom: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); transition: background 0.2s; }
  .dot.done { background: var(--ok); }
  .dot.active { background: var(--brand); width: 14px; height: 14px; }
  .row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 11px 13px; margin-bottom: 8px; }
  .row.me { border-color: var(--ink); background: var(--brand-tint); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .avatar svg { width: 100%; height: 100%; display: block; }
  .statrow { display: flex; gap: 8px; margin-top: 12px; }

    if (t === 'dark') return true;
    if (t === 'light') return false;
    try { return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; } catch(e){ return false; }
  }
  function palette(){ return isDarkMode() ? PALETTE_DARK : PALETTE_LIGHT; }

  function uid(){ try { return crypto.randomUUID(); } catch(e){ return 'p_' + Math.random().toString(36).slice(2) + Date.now(); } }

  // A locally-generated anonymous id (before signing up/in) always contains
  // a hyphen (crypto.randomUUID()) or starts with "p_" — a real Firebase
  // Auth uid never does. Used to tell "this was a pre-account player" apart
  // from "this is a different real account", so migratePlayerId() below can
  // never merge two distinct signed-in players' history together.
  function looksAnonymousPlayerId(id){
    return !!id && (id.indexOf('-') !== -1 || id.indexOf('p_') === 0);
  }

  // Someone who played a few days anonymously and then created an account
  // gets a brand-new Firebase uid, which used to silently split them into
  // two separate entries in the standings (their earlier days' points never
  // counted). This carries their member row and every response doc they
  // already have in the CURRENT league over to the new uid so their total
  // stays whole. Best-effort / fire-and-forget: it runs once right after
  // sign-in and any failure just logs, it never blocks the app.
  function migratePlayerId(gid, oldId, newId){
    if (!firestoreDb || !gid || !oldId || !newId || oldId === newId) return;
    if (!looksAnonymousPlayerId(oldId)) return;
    var db = firestoreDb;
    var season = state.season || 1;
    var oldMemberRef = db.doc('groups/' + gid + '/members/' + oldId);
    oldMemberRef.get().then(function(snap){
      if (!snap.exists) return;
      var data = snap.data();
      data.playerId = newId;
      return db.doc('groups/' + gid + '/members/' + newId).set(data).then(function(){
        return oldMemberRef.delete();
      });
    }).catch(function(e){ console.error('quizco migrate member error', e); });

    var respCol = db.collection('groups/' + gid + '/seasons/' + season + '/responses');
    respCol.where('playerId', '==', oldId).get().then(function(qs){
      qs.docs.forEach(function(d){
        var data = d.data();
        var oldDocId = d.id;
        data.playerId = newId;
        var newRef = db.doc('groups/' + gid + '/seasons/' + season + '/responses/' + data.day + '_' + newId);
        var oldRef = db.doc('groups/' + gid + '/seasons/' + season + '/responses/' + oldDocId);
        newRef.set(data).then(function(){ return oldRef.delete(); })
          .catch(function(e){ console.error('quizco migrate response error', e); });
      });
    }).catch(function(e){ console.error('quizco migrate responses query error', e); });
  }
  function gpath(suffix){ return 'groups/' + state.groupId + '/' + suffix; }
  // IMPORTANT: the db capability requires collection paths to have an ODD
  // number of slash-separated segments and document paths an EVEN number
  // (it throws a synchronous TypeError otherwise). gpath(suffix) always adds
  // exactly 2 segments ("groups", groupId), so it preserves suffix's parity.
  // The season prefix here MUST also add an even number of segments (2:
  // "seasons", the season number) so every path built on top of spath keeps
  // the same parity it would have under gpath alone — a single-segment
  // prefix like "s1" would flip every path's parity and break every
  // collection()/doc() call built from it.
  function spath(suffix){ return gpath('seasons/' + state.season + '/' + suffix); }
  function genGroupCode(){
    var chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // sin 0/O ni 1/I/L, para que no se confundan al copiarlo a mano
    var code = '';
    for (var i=0; i<5; i++) code += chars[Math.floor(Math.random()*chars.length)];
    return code;
  }
  function leagueColorIndex(id){

  function lsGet(k, d){ try { var v = localStorage.getItem(k); return v===null ? d : v; } catch(e){ return d; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  function readJson(k, d){ try { var v = JSON.parse(lsGet(k, '')); return (v && typeof v === 'object') ? v : d; } catch(e){ return d; } }

  // Each entry is {id, name}. Older versions stored a plain array of code
  // strings — those are transparently upgraded to {id: code, name: ''}.
  function getJoinedLeagues(){
    try {
      var v = JSON.parse(lsGet('qc_leagues', '[]'));
      if (!Array.isArray(v)) return [];
      return v.map(function(item){
        if (typeof item === 'string') return { id: item, name: '' };
        return { id: item.id, name: item.name || '' };
      });
    } catch(e){ return []; }
  }
  function addJoinedLeague(id, name){
    if (!id) return;
    var list = getJoinedLeagues();
    var existing = null;
    for (var i=0; i<list.length; i++){ if (list[i].id === id) { existing = list[i]; break; } }
    if (existing){
      if (name != null) existing.name = name;
    } else {
      list.push({ id: id, name: name || '' });
    }
    lsSet('qc_leagues', JSON.stringify(list));
  }

  function qcFindChar(charId){
    var c = null;
    QC_CHARS.forEach(function(x){ if (x.id === charId) c = x; });
    return c || QC_CHARS[0];
  }

  /* full-body figure with everything equipped */
  function qcFigure(charId, eq, viewBox){
    eq = eq || {};
    var c = qcFindChar(charId);
    var s = '<svg viewBox="'+(viewBox || '0 0 120 180')+'" style="display:block;width:100%;height:100%;">';
    s += qcCharInner(c, eq);
    s += qcHand(eq.mano);
    if (eq.sombrero) s += '<g transform="translate(60,42) scale(0.86) translate(-50,-72)">' + qcHatInner(eq.sombrero) + '</g>';
    s += '</svg>';
    return s;
  }
  /* head-and-shoulders crop, for the small round avatars in lists */
  function qcAvatar(charId, eq){
    return qcFigure(charId, eq, '26 2 68 68');

  // Draws the avatar for a given player: their chosen character wearing
  // whatever they have equipped. Falls back to the first character for
  // players who joined before characters existed.
  function avatarHTML(name, playerId){
    var look = lookFor(playerId);
    return qcAvatar(look.charId, look.eq);
  }
  // The look of any player: your own comes from local state (so it updates
  // the moment you equip something), everyone else's from their member doc.
  function lookFor(playerId){
    if (playerId && playerId === state.playerId){
      return { charId: state.charId, eq: state.equipped || {} };
    }
    var found = null;
    (state.members || []).forEach(function(m){ if (m.playerId === playerId) found = m; });
    if (found && found.charId) return { charId: found.charId, eq: found.equipped || {} };
    // legacy members with no character saved: give them a stable one from their id
    var h = 0, s = String(playerId || '');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return { charId: QC_CHARS[h % QC_CHARS.length].id, eq: {} };
  }
  function fmtTime(ms){
    var s = Math.max(0, Math.floor((ms||0)/1000));
    var m = Math.floor(s/60); s = s % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function startQuizTimer(){
    stopQuizTimer();
    state.quizTimerInterval = setInterval(function(){
      var elQ = document.getElementById('qcTimerQ');
      var elT = document.getElementById('qcTimerTotal');
      if (!elQ && !elT) { stopQuizTimer(); return; }
      if (elQ) elQ.textContent = fmtTime(Date.now() - state.qStartTs);
      if (elT) elT.textContent = fmtTime(Date.now() - state.startTs);
    }, 1000);
  }
  function stopQuizTimer(){
    if (state.quizTimerInterval) { clearInterval(state.quizTimerInterval); state.quizTimerInterval = null; }
  }
  function todayDateStr(){
    var d = new Date();
    var mm = String(d.getMonth()+1); if (mm.length < 2) mm = '0' + mm;
    var dd = String(d.getDate()); if (dd.length < 2) dd = '0' + dd;
    return d.getFullYear() + '-' + mm + '-' + dd;
  }
  function daysBetween(a, b){
    var da = new Date(a + 'T00:00:00');
    var db_ = new Date(b + 'T00:00:00');
    return Math.round((da - db_) / 86400000);
  }
  // Like todayDateStr(), but the day boundary sits at `hour` local time instead
  // of midnight — e.g. with hour=9, anything before 9:00am still counts as the
  // previous day. Leagues created before this feature keep hour=0 (midnight),
  // so their day timing is unchanged.
  function effectiveDateStr(hour){
    var h = (hour == null) ? 0 : hour;
    var d = new Date(Date.now() - h * 3600000);
    var mm = String(d.getMonth()+1); if (mm.length < 2) mm = '0' + mm;
    var dd = String(d.getDate()); if (dd.length < 2) dd = '0' + dd;
    return d.getFullYear() + '-' + mm + '-' + dd;
  }
  function hourPickerHtml(id){
    var opts = '';
    for (var h=0; h<24; h++){
      var label = (h<10?'0':'') + h + ':00';
      opts += '<option value="' + h + '"' + (h===9?' selected':'') + '>' + label + '</option>';
    }
    return '<div class="mt16" style="text-align:left;">'
      + '<div class="faint" style="margin-bottom:6px;">¿A qué hora se desbloquea el quiz cada día?</div>'
      + '<select id="' + id + '" style="width:100%;border:2.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14px;font-weight:600;">' + opts + '</select>'
      + '</div>';
  }

    var s = season || state.season || 1;

    var idx = (((s - 1) * 6 + (day - 1)) % totalBlocks + totalBlocks) % totalBlocks;
    return QUESTIONS[idx];

  function signInWithEmail(email, password){
    if (!firebaseAuth || state.authLoading) return;
    email = (email || '').trim();
    if (!email || !password){ state.authError = 'Escribe tu correo y tu contraseña.'; render(); return; }
    state.authLoading = true;
    state.authError = null;
    render();
    firebaseAuth.signInWithEmailAndPassword(email, password).catch(function(e){
      console.error('quizco email sign-in error', e);
      state.authLoading = false;
      state.authError = authErrorMessage(e);
      render();
    });
    // On success, onAuthStateChanged (see initAuth) picks it up and moves the app forward.
  }

  function signUpWithEmail(email, password, country, birthday){
    if (!firebaseAuth || state.authLoading) return;
    email = (email || '').trim();
    country = (country || '').trim();
    birthday = (birthday || '').trim();
    if (!email || !password){ state.authError = 'Escribe tu correo y tu contraseña.'; render(); return; }
    if (password.length < 6){ state.authError = 'La contraseña debe tener al menos 6 caracteres.'; render(); return; }
    if (!country){ state.authError = 'Selecciona tu país.'; render(); return; }
    if (!birthday){ state.authError = 'Indica tu fecha de nacimiento.'; render(); return; }
    state.authLoading = true;
    state.authError = null;
    render();
    firebaseAuth.createUserWithEmailAndPassword(email, password).then(function(cred){
      var uid = cred && cred.user && cred.user.uid;
      if (uid && firestoreDb){
        firestoreDb.doc('users/' + uid).set({ email: email, country: country, birthday: birthday, createdAt: Date.now() }).catch(function(e){
          console.error('quizco save profile error', e);
        });
      }
    }).catch(function(e){
      console.error('quizco email sign-up error', e);
      state.authLoading = false;
      state.authError = authErrorMessage(e);
      render();
    });
  }

  // Google Identity Services (the accounts.google.com/gsi/client script) is
  // Google's own current library for "Sign in with Google". We use it —
  // instead of Firebase Auth's own signInWithPopup/signInWithRedirect — for
  // one specific reason: Firebase's popup/redirect flow relies on a bit of
  // storage being shared between this app's domain (github.io) and
  // Firebase's own auth domain (firebaseapp.com), and browsers with strict
  // tracking protection (Safari's ITP, and increasingly Chrome) silently
  // block that. That's exactly what was happening: the redirect completed
  // on Google's side, came back to the app, and quietly never finished
  // signing in. Google Identity Services gets us an access token directly
  // (no cross-domain storage involved), which we then hand to Firebase.
  var googleTokenClient = null;

  function ensureGoogleTokenClient(){
    if (googleTokenClient) return googleTokenClient;
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) return null;
    googleTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_WEB_CLIENT_ID,
      scope: 'openid email profile',
      callback: function(resp){
        if (resp && resp.access_token){
          finishGoogleSignIn(resp.access_token);
        } else {
          state.authLoading = false;
          state.authError = 'No se ha podido completar el inicio de sesión con Google.';
          render();
        }
      },
      error_callback: function(err){
        console.error('quizco google token client error', err);
        state.authLoading = false;
        // 'popup_closed': the person closed the account picker themselves —
        // not a real error, no need to alarm them with a message.
        if (!err || err.type !== 'popup_closed'){
          state.authError = 'No se ha podido completar el inicio de sesión con Google. Comprueba tu conexión e inténtalo de nuevo.';
        }
        render();
      }
    });
    return googleTokenClient;
  }

  function finishGoogleSignIn(accessToken){
    var credential = firebase.auth.GoogleAuthProvider.credential(null, accessToken);
    firebaseAuth.signInWithCredential(credential).catch(function(e){
      console.error('quizco google credential sign-in error', e);
      state.authLoading = false;
      state.authError = authErrorMessage(e);
      render();
    });
    // On success, onAuthStateChanged (see initAuth) picks it up and moves the app forward.
  }

  function signInWithGoogle(){
    if (!firebaseAuth || state.authLoading) return;
    if (!GOOGLE_WEB_CLIENT_ID || GOOGLE_WEB_CLIENT_ID === 'PON_AQUI_TU_ID_DE_CLIENTE_WEB'){
      state.authError = 'Falta configurar el ID de cliente web de Google (variable GOOGLE_WEB_CLIENT_ID al principio del archivo).';
      render();
      return;
    }
    var client = ensureGoogleTokenClient();
    if (!client){
      state.authError = 'No se ha podido cargar el inicio de sesión de Google. Comprueba tu conexión y recarga la página.';
      render();
      return;
    }
    state.authLoading = true;
    state.authError = null;
    render();
    client.requestAccessToken();
  }

  function buildSeries(allDocs){
    var byDay = {1:[],2:[],3:[],4:[],5:[],6:[]};
    var maxDay = 0;
    var playersMeta = {};
    allDocs.forEach(function(doc){
      if (byDay[doc.day]) byDay[doc.day].push(doc);
      if (doc.day > maxDay) maxDay = doc.day;
      var ts = Date.parse(doc.submittedAt) || 0;
      if (!playersMeta[doc.playerId]) playersMeta[doc.playerId] = { name: doc.playerName, firstTs: ts };
      else { playersMeta[doc.playerId].name = doc.playerName; if (ts < playersMeta[doc.playerId].firstTs) playersMeta[doc.playerId].firstTs = ts; }
    });
    if (maxDay === 0) return { series: [], maxDay: 0 };
    var pal = palette();
    var playerIds = Object.keys(playersMeta).sort(function(a,b){ return playersMeta[a].firstTs - playersMeta[b].firstTs; });
    var cum = {}; playerIds.forEach(function(pid){ cum[pid] = 0; });
    var series = playerIds.map(function(pid, idx){
      return { playerId: pid, name: playersMeta[pid].name, color: pal[idx % pal.length], points: [] };
    });
    for (var d=1; d<=maxDay; d++){
      var dayBoard = computeLeaderboard(byDay[d]);
      var totalsByPid = {};
      dayBoard.forEach(function(r){ totalsByPid[r.playerId] = r.total; });
      series.forEach(function(s){
        cum[s.playerId] += (totalsByPid[s.playerId] || 0);
        s.points.push({ day: d, value: cum[s.playerId] });
      });
    }
    return { series: series, maxDay: maxDay };
  }

  function renderChartSvg(built){
    var W = 340, H = 200, padL = 30, padR = 8, padT = 10, padB = 22;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var maxVal = 0;
    built.series.forEach(function(s){ s.points.forEach(function(p){ if (p.value > maxVal) maxVal = p.value; }); });
    var step = maxVal <= 50 ? 10 : (maxVal <= 150 ? 25 : 50);
    var niceMax = Math.max(step, Math.ceil((maxVal || 1) / step) * step);
    function xAt(day){ return built.maxDay <= 1 ? (padL + plotW/2) : (padL + (day-1)/(built.maxDay-1) * plotW); }
    function yAt(val){ return padT + plotH - (val / niceMax) * plotH; }

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';

    // gridlines + y labels
    [0, 0.5, 1].forEach(function(f){
      var val = Math.round(niceMax * f);
      var y = yAt(val);
      svg += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W-padR) + '" y2="' + y + '" style="stroke:var(--line);stroke-width:1;"/>';
      svg += '<text x="' + (padL-6) + '" y="' + (y+3) + '" text-anchor="end" font-size="9" style="fill:var(--ink-faint);" font-family="Work Sans, sans-serif">' + val + '</text>';
    });

    // x labels
    for (var d=1; d<=built.maxDay; d++){
      svg += '<text x="' + xAt(d) + '" y="' + (H-6) + '" text-anchor="middle" font-size="9" style="fill:var(--ink-faint);" font-family="Work Sans, sans-serif">D' + d + '</text>';
    }

    // lines
    built.series.forEach(function(s){
      var pts = s.points.map(function(p){ return xAt(p.day) + ',' + yAt(p.value); }).join(' ');
      svg += '<polyline points="' + pts + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    });

    // markers (+ larger invisible hit targets)
    built.series.forEach(function(s){
      s.points.forEach(function(p){
        var cx = xAt(p.day), cy = yAt(p.value);
        svg += '<circle cx="' + cx + '" cy="' + cy + '" r="14" fill="transparent" class="qcpt" data-name="' + esc(s.name) + '" data-day="' + p.day + '" data-value="' + p.value + '" style="cursor:pointer;"/>';
        svg += '<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="' + s.color + '" style="stroke:var(--surface);stroke-width:2;pointer-events:none;"/>';
      });
    });

    svg += '</svg>';
    return svg;
  }

  function computeDesempateBonus(answers){
    if (!answers || !answers.length) return {};
    var correct = answers.filter(function(a){ return a.correct; });
    if (!correct.length) return {};
    // Sort by time first, then by playerId as a deterministic tiebreaker so every
    // client (whose snapshot may list docs in a different order) computes the
    // exact same winner on an exact-timeMs tie.
    var sorted = correct.slice().sort(function(a,b){
      return a.timeMs - b.timeMs || (a.playerId < b.playerId ? -1 : (a.playerId > b.playerId ? 1 : 0));
    });
    var map = {};
    map[sorted[0].playerId] = DESEMPATE_BONUS;
    return map;
  }

  function bindChat(){
    if (state.chatGifPickerOpen) { bindGifPicker(); return; }
    var list = document.getElementById('chatList');
    if (list) list.scrollTop = list.scrollHeight;
    var input = document.getElementById('chatInput');
    var sendBtn = document.getElementById('chatSendBtn');
    var gifBtn = document.getElementById('chatGifBtn');
    function send(){
      if (!input || !state.db) return;
      var v = input.value.trim();
      if (!v) return;
      var msgId = state.playerId + '_' + Date.now();
      state.chatDraft = '';
      input.value = '';
      state.db.doc(gpath('chat/' + msgId)).set({
        playerId: state.playerId, playerName: state.playerName,
        text: v.slice(0,240), ts: new Date().toISOString()
      }).catch(function(e){ console.error('quizco chat send error', e); });
    }
    if (input){
      input.addEventListener('input', function(){ state.chatDraft = input.value; });
      input.addEventListener('focus', function(){ state.chatFocused = true; });
      input.addEventListener('blur', function(){ state.chatFocused = false; });
      input.addEventListener('keydown', function(e){ if (e.key === 'Enter') send(); });
      if (state.chatFocused){
        input.focus();
        var len = input.value.length;
        try { input.setSelectionRange(len, len); } catch(e){}
      }
    }
    if (sendBtn) sendBtn.addEventListener('click', send);
    if (gifBtn){
      gifBtn.addEventListener('click', function(){
        state.chatGifPickerOpen = true;
        render();
        if (state.chatGifResults === null) searchGifs('');
      });
    }

    var i, reactionBtns = document.querySelectorAll('.reactionbtn');
    for (i = 0; i < reactionBtns.length; i++){
      (function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          setReaction(btn.getAttribute('data-msgid'), btn.getAttribute('data-emoji'));
        });
      })(reactionBtns[i]);
    }
    var chips = document.querySelectorAll('.reactionchip');
    for (i = 0; i < chips.length; i++){
      (function(chip){
        chip.addEventListener('click', function(e){
          e.stopPropagation();
          setReaction(chip.getAttribute('data-msgid'), chip.getAttribute('data-emoji'));
        });
      })(chips[i]);
    }
    var msgEls = document.querySelectorAll('.chatmsg[data-msgid]');
    var pressTimer = null;
    var pressMoved = false;
    function startPress(msgId){
      if (!msgId) return;
      pressMoved = false;
      pressTimer = setTimeout(function(){
        if (!pressMoved){ state.chatReactionPickerFor = msgId; render(); }
      }, 500);
    }
    function cancelPress(){ if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; } }
    for (i = 0; i < msgEls.length; i++){
      (function(el){
        var msgId = el.getAttribute('data-msgid');
        el.addEventListener('mousedown', function(){ startPress(msgId); });
        el.addEventListener('touchstart', function(){ startPress(msgId); }, { passive: true });
        el.addEventListener('mouseup', cancelPress);
        el.addEventListener('mouseleave', cancelPress);
        el.addEventListener('touchend', cancelPress);
        el.addEventListener('touchmove', function(){ pressMoved = true; cancelPress(); }, { passive: true });
        el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
      })(msgEls[i]);
    }
    if (state.chatReactionPickerFor){
      setTimeout(function(){
        document.addEventListener('click', function closeReactionBar(e){
          if (!e.target.closest || !e.target.closest('.reactionbar')){
            state.chatReactionPickerFor = null;
            render();
          }
        }, { once: true });
      }, 0);
    }
  }

  function setReaction(msgId, emoji){
    if (!state.db || !msgId) return;
    var msg = (state.chatMessages || []).find(function(m){ return m.id === msgId; });
    var newReactions = Object.assign({}, (msg && msg.reactions) || {});

      console.error('quizco chat reaction error', e);
    });

    render();
  }

  function searchGifs(query){
    if (!GIPHY_API_KEY || GIPHY_API_KEY === 'TU_GIPHY_KEY') { render(); return; }
    state.chatGifLoading = true;
    state.chatGifError = null;
    render();
    var endpoint = query
      ? 'https://api.giphy.com/v1/gifs/search?api_key=' + encodeURIComponent(GIPHY_API_KEY) + '&q=' + encodeURIComponent(query) + '&limit=24&rating=pg-13&lang=es'
      : 'https://api.giphy.com/v1/gifs/trending?api_key=' + encodeURIComponent(GIPHY_API_KEY) + '&limit=24&rating=pg-13';

      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(data){
      state.chatGifLoading = false;
      state.chatGifResults = (data.data || []).map(function(g){
        var imgs = g.images || {};
        var thumbImg = imgs.fixed_width_small || imgs.fixed_width || imgs.original || {};
        var fullImg = imgs.fixed_width || imgs.original || {};
        return { thumb: thumbImg.url, full: fullImg.url };
      }).filter(function(g){ return g.thumb && g.full; });
      render();
    }).catch(function(e){
      console.error('quizco giphy search error', e);

  function computeSeasonBadges(allDocs, desempateBonusMap){
    var byDay = {};
    allDocs.forEach(function(d){ (byDay[d.day] = byDay[d.day] || []).push(d); });
    var days = Object.keys(byDay).map(Number).sort(function(a,b){ return a-b; });
    if (!days.length) return null;

    var dayBoard = {};
    days.forEach(function(day){ dayBoard[day] = computeLeaderboard(byDay[day]); });

    var players = {};
    function ensure(pid, name){
      if (!players[pid]) players[pid] = {
        playerId: pid, playerName: name, totalPoints: 0, totalCorrect: 0, totalBonus: 0,
        daysPlayed: [], catCorrect: {}, catTotal: {}, dailyTotal: {}, plenoDays: []
      };
      return players[pid];
    }

    days.forEach(function(day){
      var qs = questionsForDay(day);
      dayBoard[day].forEach(function(row){
        var p = ensure(row.playerId, row.playerName);
        p.totalPoints += row.total;
        p.totalCorrect += row.correctCount;
        p.totalBonus += row.bonus;
        p.daysPlayed.push(day);
        p.dailyTotal[day] = row.total;
        if (row.correctCount === 6) p.plenoDays.push(day);
      });
      byDay[day].forEach(function(d){
        var p = ensure(d.playerId, d.playerName);
        (d.answers || []).forEach(function(a){
          var cat = qs[a.qi] ? qs[a.qi].cat : null;
          if (cat == null) return;
          p.catTotal[cat] = (p.catTotal[cat] || 0) + 1;
          if (a.correct) p.catCorrect[cat] = (p.catCorrect[cat] || 0) + 1;
        });
      });
    });

    var plist = Object.keys(players).map(function(k){ return players[k]; });
    if (!plist.length) return null;

    if (desempateBonusMap){
      plist.forEach(function(p){
        if (desempateBonusMap[p.playerId]) p.totalPoints += desempateBonusMap[p.playerId];
      });
    }

    function topBy(fn, filterFn){
      var scored = plist.filter(filterFn || function(){ return true; })
        .map(function(p){ return { p: p, v: fn(p) }; })
        .filter(function(s){ return s.v != null && isFinite(s.v); });
      if (!scored.length) return { value: null, winners: [] };
      var max = Math.max.apply(null, scored.map(function(s){ return s.v; }));
      return { value: max, winners: scored.filter(function(s){ return s.v === max; }).map(function(s){ return s.p; }) };
    }
    function minBy(fn, filterFn){
      var scored = plist.filter(filterFn || function(){ return true; })
        .map(function(p){ return { p: p, v: fn(p) }; })
        .filter(function(s){ return s.v != null && isFinite(s.v); });
      if (!scored.length) return { value: null, winners: [] };
      var min = Math.min.apply(null, scored.map(function(s){ return s.v; }));
      return { value: min, winners: scored.filter(function(s){ return s.v === min; }).map(function(s){ return s.p; }) };
    }
    function rankOnDay(p, day){
      var rows = dayBoard[day];
      if (!rows) return null;
      for (var i=0; i<rows.length; i++){ if (rows[i].playerId === p.playerId) return i; }
      return null;
    }

    var badges = [];

    var champ = topBy(function(p){ return p.totalPoints; });
    badges.push({ icon:'🏆', name:'Campeón de la liga', desc:'Más puntos acumulados en toda la temporada.', winners:champ.winners, value: champ.value!=null ? (champ.value+' pts') : null });

    var acc = topBy(function(p){ return p.totalCorrect; });
    badges.push({ icon:'🎯', name:'Punto de mira', desc:'Más respuestas acertadas en total.', winners:acc.winners, value: acc.value!=null ? (acc.value+' aciertos') : null });

    var speed = topBy(function(p){ return p.totalBonus; }, function(p){ return p.totalBonus > 0; });
    badges.push({ icon:'⚡', name:'Rayo', desc:'Más veces el más rápido en acertar una pregunta.', winners:speed.winners, value: speed.value!=null ? (speed.value+' veces') : null });

    function longestStreak(p){
      var set = {}; p.plenoDays.forEach(function(d){ set[d] = true; });
      var best = 0, cur = 0;
      for (var d=1; d<=6; d++){ if (set[d]) { cur++; if (cur>best) best=cur; } else cur = 0; }
      return best;
    }
    var streak = topBy(longestStreak, function(p){ return longestStreak(p) >= 2; });
    badges.push({ icon:'🔥', name:'Racha imparable', desc:'Más días seguidos con pleno de 6/6.', winners:streak.winners, value: streak.value!=null ? (streak.value+' días seguidos') : null });

    var specEntries = [];
    plist.forEach(function(p){
      Object.keys(p.catTotal).forEach(function(catIdx){
        var total = p.catTotal[catIdx];
        if (total < 2) return;
        var correct = p.catCorrect[catIdx] || 0;
        specEntries.push({ pct: correct/total, total: total, catIdx: catIdx, playerId: p.playerId, playerName: p.playerName });
      });
    });
    if (specEntries.length){
      var maxPct = Math.max.apply(null, specEntries.map(function(e){ return e.pct; }));
      if (maxPct > 0){
        var topPct = specEntries.filter(function(e){ return e.pct === maxPct; });
        var maxTotal = Math.max.apply(null, topPct.map(function(e){ return e.total; }));
        var topEntries = topPct.filter(function(e){ return e.total === maxTotal; });
        var winCat = topEntries[0].catIdx;
        var specWinners = topEntries.filter(function(e){ return e.catIdx === winCat; });
        badges.push({
          icon:'🧠', name:'Cerebrito de ' + CATS[winCat].name,
          desc:'Mejor porcentaje de aciertos en esta categoría.',
          winners: specWinners.map(function(e){ return { playerId: e.playerId, playerName: e.playerName }; }),
          value: Math.round(maxPct*100) + '%'
        });
      }
    }

    var remontada = topBy(function(p){
      var pdays = p.daysPlayed.slice().sort(function(a,b){ return a-b; });
      if (pdays.length < 2) return null;
      var r0 = rankOnDay(p, pdays[0]);
      var r1 = rankOnDay(p, pdays[pdays.length-1]);
      if (r0 == null || r1 == null) return null;
      return r0 - r1;
    }, function(p){ return p.daysPlayed.length >= 2; });
    if (remontada.value != null && remontada.value > 0){
      badges.push({ icon:'📈', name:'La Remontada', desc:'Mayor subida en la clasificación diaria entre su primer y último día jugado.', winners:remontada.winners, value:'+' + remontada.value + ' puestos' });
    }

    function podiumCount(p){
      var c = 0;
      p.daysPlayed.forEach(function(day){ var r = rankOnDay(p, day); if (r != null && r < 3) c++; });
      return c;
    }
    var podium = topBy(podiumCount, function(p){ return podiumCount(p) > 0; });
    badges.push({ icon:'🥉', name:'Asiduo al podio', desc:'Más días acabando entre los 3 primeros.', winners:podium.winners, value: podium.value!=null ? (podium.value+' días') : null });

    function stdDev(p){
      var vals = p.daysPlayed.map(function(d){ return p.dailyTotal[d]; });
      if (vals.length < 2) return null;
      var mean = vals.reduce(function(a,b){ return a+b; }, 0) / vals.length;
      var variance = vals.reduce(function(a,b){ return a + (b-mean)*(b-mean); }, 0) / vals.length;
      return Math.sqrt(variance);
    }
    var constancia = minBy(stdDev, function(p){ return p.daysPlayed.length >= 2; });
    badges.push({ icon:'🧊', name:'Constancia de hierro', desc:'La puntuación más regular día a día.', winners:constancia.winners, value: constancia.value!=null ? ('±' + constancia.value.toFixed(1) + ' pts') : null });

    function firstSubmitCount(p){
      var c = 0;
      p.daysPlayed.forEach(function(day){
        var docsOfDay = byDay[day];
        var earliest = docsOfDay.reduce(function(a,b){ return Date.parse(a.submittedAt) < Date.parse(b.submittedAt) ? a : b; });
        if (earliest.playerId === p.playerId) c++;
      });
      return c;
    }
    var madrugador = topBy(firstSubmitCount, function(p){ return firstSubmitCount(p) > 0; });
    badges.push({ icon:'🐤', name:'Madrugador', desc:'Más veces el primero en enviar sus respuestas del día.', winners:madrugador.winners, value: madrugador.value!=null ? (madrugador.value+' días') : null });

    var totalDays = days.length;
    var asistencia = plist.filter(function(p){ return p.daysPlayed.length === totalDays; });
    if (totalDays >= 2 && asistencia.length){
      badges.push({
        icon:'🎟️', name:'Pleno de asistencia', desc:'No se ha perdido ni un día de liga.',
        winners: asistencia.map(function(p){ return { playerId:p.playerId, playerName:p.playerName }; }),
        value: totalDays + '/' + totalDays + ' días'
      });
    }

    badges = badges.filter(function(b){ return b.winners && b.winners.length > 0; });

    var maxDay = days[days.length-1];
    var seasonComplete = maxDay === 6 && plist.every(function(p){ return p.daysPlayed.indexOf(6) !== -1; });

    return {
      days: days, maxDay: maxDay, seasonComplete: seasonComplete, badges: badges,
      champWinners: champ.winners, champTie: champ.winners.length > 1
    };
  }

  function computeLeaderboard(docs){
    var bonusMap = {};
    for (var qi=0; qi<6; qi++){
      var minTime = Infinity, winners = [];
      docs.forEach(function(d){
        var a = d.answers && d.answers[qi];
        if (a && a.correct){
          if (a.timeMs < minTime){ minTime = a.timeMs; winners = [d.playerId]; }
          else if (a.timeMs === minTime){ winners.push(d.playerId); }
        }
      });
      winners.forEach(function(pid){ bonusMap[pid] = (bonusMap[pid]||0) + 1; });
    }
    return docs.map(function(d){
      var bonus = bonusMap[d.playerId] || 0;
      return {
        playerId: d.playerId, playerName: d.playerName, correctCount: d.correctCount,
        bonus: bonus, total: d.correctCount*10 + bonus, totalTimeMs: d.totalTimeMs,
        isMe: d.playerId === state.playerId
      };
    }).sort(function(a,b){ return b.total - a.total || a.totalTimeMs - b.totalTimeMs; });
  }

  function computeStandings(allDocs){
    var byDay = {};
    (allDocs || []).forEach(function(d){ (byDay[d.day] = byDay[d.day] || []).push(d); });
    var players = {};
    Object.keys(byDay).forEach(function(day){
      computeLeaderboard(byDay[day]).forEach(function(row){
        var p = players[row.playerId] || (players[row.playerId] = { playerId: row.playerId, playerName: row.playerName, totalPoints: 0, daysPlayed: 0 });
        p.totalPoints += row.total;
        p.daysPlayed += 1;
        p.playerName = row.playerName;
      });
    });
    return Object.keys(players).map(function(k){ return players[k]; })
      .sort(function(a,b){ return b.totalPoints - a.totalPoints; });
  }

  function computeFullStandings(members, allDocs){
    var standings = computeStandings(allDocs);
    var byId = {};
    standings.forEach(function(s){ byId[s.playerId] = s; });
    var list = (members || []).map(function(m){
      var s = byId[m.playerId];
      return s
        ? { playerId: m.playerId, playerName: m.playerName, totalPoints: s.totalPoints, daysPlayed: s.daysPlayed }
        : { playerId: m.playerId, playerName: m.playerName, totalPoints: 0, daysPlayed: 0 };
    });
    standings.forEach(function(s){
      if (!list.some(function(l){ return l.playerId === s.playerId; })) list.push(s);
    });
    return list.sort(function(a,b){ return b.totalPoints - a.totalPoints || a.playerName.localeCompare(b.playerName); });
  }

  function computeSeasonRecap(allDocs){
    var totalAnswers = 0, totalCorrect = 0;
    var qStats = {};
    (allDocs || []).forEach(function(d){
      (d.answers || []).forEach(function(a){
        totalAnswers++;
        if (a.correct) totalCorrect++;
        var key = d.day + '_' + a.qi;
        var s = qStats[key] || (qStats[key] = { day: d.day, qi: a.qi, correct: 0, total: 0 });
        s.total++;
        if (a.correct) s.correct++;
      });
    });
    var hardest = null;
    Object.keys(qStats).forEach(function(k){
      var s = qStats[k];
      if (s.total < 2) return;
      var pct = s.correct / s.total;
      if (!hardest || pct < hardest.pct) hardest = { day: s.day, qi: s.qi, pct: pct };
    });
    var hardestQ = null;
    if (hardest){
      var hq = questionsForDay(hardest.day)[hardest.qi];
      if (hq) hardestQ = { text: hq.q, pct: Math.round(hardest.pct*100), day: hardest.day };
    }
    return { totalAnswers: totalAnswers, totalCorrect: totalCorrect, hardestQ: hardestQ };
  }

  // The account-level shop: your character's wardrobe, the same in every
  // league you play. Anything that gives an actual gameplay edge (keys to
  // unlock themed leagues, group perks) lives in the separate per-league shop
  // instead — see leagueShopScreen().
  //
  // The stock rotates daily: exactly one item per slot, and each one's rarity
  // is rolled at random. The roll is seeded off the date, so the whole group
  // sees the same shop on the same day with nothing stored anywhere, and it
  // changes on its own at midnight. Legendary is deliberately the long shot.
  var RARITY_ODDS = [
    { key: 'normal', chance: 35 },
    { key: 'raro', chance: 27 },
    { key: 'muyraro', chance: 20 },
    { key: 'epico', chance: 13 },
    { key: 'legendario', chance: 5 }
  ];
  function seedHash(s){
    var h = 2166136261;
    for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0);
  }
  function dailyRarityFor(slotKey){
    var r = seedHash(todayDateStr() + '|' + slotKey) % 100;
    var acc = 0;
    for (var i = 0; i < RARITY_ODDS.length; i++){
      acc += RARITY_ODDS[i].chance;
      if (r < acc) return RARITY_ODDS[i].key;
    }
    return 'normal';
  }
  // Today's five items, one per slot.
  function dailyStock(){
    return QC_SLOTS.map(function(slot){
      var rk = dailyRarityFor(slot.key);
      var item = null;
      QC_ITEMS[slot.key].forEach(function(x){ if (x.rarity === rk) item = x; });
      return { slot: slot, item: item, rarity: qcRarity(rk) };
    });
  }
  function ownsItem(slotKey, itemId){
    var list = state.owned[slotKey] || [];
    return list.indexOf(itemId) !== -1;
  }
  function buyItem(slotKey, itemId, price){
    if (ownsItem(slotKey, itemId) || (state.coins || 0) < price) return;
    state.coins -= price;
    lsSet('qc_coins', String(state.coins));
    state.owned[slotKey] = (state.owned[slotKey] || []).concat([itemId]);
    writeJson('qc_owned', state.owned);
    // buying something puts it on straight away — that's the fun part
    state.equipped[slotKey] = itemId;
    writeJson('qc_equipped', state.equipped);
    saveLookToMember();
    render();
  }
  function toggleEquip(slotKey, itemId){
    if (!ownsItem(slotKey, itemId)) return;
    if (state.equipped[slotKey] === itemId) delete state.equipped[slotKey];
    else state.equipped[slotKey] = itemId;
    writeJson('qc_equipped', state.equipped);
    saveLookToMember();
    render();
  }
  // Mirrors your character + equipment onto your member doc, so everyone
  // else's leaderboard, chat and lobby show what you're actually wearing.
  function saveLookToMember(){
    if (!state.db || !state.groupId || !state.playerId) return;
    try {
      state.db.doc(gpath('members/' + state.playerId)).get().then(function(snap){
        var data = (snap.exists && snap.data()) || {};
        data.playerId = state.playerId;
        data.playerName = state.playerName;
        data.charId = state.charId;
        data.equipped = state.equipped || {};
        if (!data.joinedAt) data.joinedAt = new Date().toISOString();
        return state.db.doc(gpath('members/' + state.playerId)).set(data);
      }).catch(function(e){ console.error('quizco look save error', e); });
    } catch(e){ console.error('quizco look save error', e); }
  }
  // Watching an ad here is real (no payment involved), up to 5 times a day;
  // it spins this weighted table for a coin reward. Chances sum to 100.
  var COIN_ROULETTE = [
    { coins: 1, chance: 50 },
    { coins: 5, chance: 25 },
    { coins: 10, chance: 15 },
    { coins: 20, chance: 8 },
    { coins: 50, chance: 2 }
  ];
  var COIN_PACKS = [
    { coins: 50, price: '0,99 €' },
    { coins: 100, price: '1,50 €' },
    { coins: 500, price: '5,50 €' },
    { coins: 1000, price: '10 €' }
  ];
  var DAILY_ROULETTE_SPINS = 5;

  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function getSpinsUsedToday(){
    if (lsGet('qc_spins_date', '') !== todayStr()) return 0;
    return parseInt(lsGet('qc_spins_used', '0'), 10) || 0;
  }
  function setSpinsUsedToday(n){
    lsSet('qc_spins_date', todayStr());
    lsSet('qc_spins_used', String(n));
  }
  // Picks which prize you win, using the chances in COIN_ROULETTE. This is the
  // only thing that decides the outcome — the wheel's equal-looking slices are
  // just the animation that shows you the result.
  function spinRouletteIndex(){
    var r = Math.random() * 100;
    var acc = 0;
    for (var i = 0; i < COIN_ROULETTE.length; i++){
      acc += COIN_ROULETTE[i].chance;
      if (r < acc) return i;
    }
    return COIN_ROULETTE.length - 1;
  }
  var ROULETTE_COLORS = { 1: '#9aa3ad', 5: '#2f9e7a', 10: '#3b7fc4', 20: '#8a56c2', 50: '#f0b93d' };
  // The wheel is drawn as ten identical slices — every prize appears twice,
  // opposite itself — so it looks like an even wheel. The odds are NOT the
  // slice sizes: which prize you get is decided by spinRouletteIndex() using
  // the chances in COIN_ROULETTE, and only then does the wheel turn to a slice
  // showing that prize.
  var WHEEL_SLICES = [1, 5, 10, 20, 50, 1, 5, 10, 20, 50];
  function polarPt(cx, cy, r, deg){
    var a = (deg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }
  function rouletteWheelHTML(){
    var cx = 50, cy = 50, r = 44;
    var span = 360 / WHEEL_SLICES.length;
    var svg = '<svg viewBox="0 0 100 100" style="display:block;width:100%;height:100%;overflow:visible;">';
    svg += '<g id="rouletteWheel" style="transform-box:fill-box;transform-origin:center;transform:rotate(' + (state.rouletteAngle || 0) + 'deg);">';
    WHEEL_SLICES.forEach(function(coins, i){
      var a0 = i * span, a1 = a0 + span;
      var p0 = polarPt(cx, cy, r, a0), p1 = polarPt(cx, cy, r, a1);
      svg += '<path d="M ' + cx + ' ' + cy + ' L ' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2)
        + ' A ' + r + ' ' + r + ' 0 0 1 ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) + ' Z"'
        + ' fill="' + ROULETTE_COLORS[coins] + '" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round"/>';
      var mid = a0 + span / 2;
      svg += '<g transform="rotate(' + mid.toFixed(2) + ' ' + cx + ' ' + cy + ')">'
        + '<text x="' + cx + '" y="' + (cy - r * 0.66).toFixed(2) + '" text-anchor="middle" dominant-baseline="middle"'
        + ' style="font-family:inherit;font-weight:900;font-size:9px;fill:#fff;">' + coins + '</text>'
        + '</g>';
    });
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--ink)" stroke-width="3"/>';
    svg += '</g>';
    // hub + pointer stay put while the wheel turns under them
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>';
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="2.6" fill="var(--ink)"/>';
    svg += '<path d="M50 14 L43 2 L57 2 Z" fill="var(--brand)" stroke="var(--ink)" stroke-width="2.6" stroke-linejoin="round"/>';
    svg += '</svg>';
    return svg;
  }
  // Where the wheel has to stop to show a given prize: pick one of the slices
  // carrying it (at random, so it doesn't always stop in the same place), then
  // spin a few full turns and finish with that slice under the pointer.
  function rouletteTargetAngle(coins){
    var span = 360 / WHEEL_SLICES.length;
    var matches = [];
    WHEEL_SLICES.forEach(function(v, i){ if (v === coins) matches.push(i); });
    if (!matches.length) matches = [0];
    var slice = matches[Math.floor(Math.random() * matches.length)];
    var mid = slice * span + span / 2 + (Math.random() - 0.5) * span * 0.6;
    var want = ((-mid) % 360 + 360) % 360;
    var base = Math.ceil((state.rouletteAngle || 0) / 360) * 360;
    return base + 360 * 5 + want;
  }
  // Watching the ad is still simulated (no ad network wired up), but the spin
  // and the coins that follow are real.
  function watchRouletteAd(){
    if (state.roulettePhase) return;
    var used = getSpinsUsedToday();
    if (used >= DAILY_ROULETTE_SPINS) return;
    state.roulettePhase = 'ad';
    state.rouletteResult = null;
    render();
    setTimeout(function(){
      var won = COIN_ROULETTE[spinRouletteIndex()].coins;
      var target = rouletteTargetAngle(won);
      state.roulettePhase = 'spin';
      state.rouletteTarget = target;
      // Update the button in place instead of re-rendering: a re-render would
      // rebuild the <svg> and kill the CSS transition mid-spin.
      var btn = document.getElementById('rouletteBtn');
      if (btn) btn.textContent = '🎡 Girando…';
      var el = document.getElementById('rouletteWheel');
      if (!el){ finishRouletteSpin(won, target, used); return; }
      requestAnimationFrame(function(){
        el.style.transition = 'transform 4.2s cubic-bezier(0.16,0.72,0.11,1)';
        el.style.transform = 'rotate(' + target + 'deg)';
      });
      setTimeout(function(){ finishRouletteSpin(won, target, used); }, 4350);
    }, 1400);
  }
  function finishRouletteSpin(won, target, used){
    state.rouletteAngle = target;
    state.rouletteTarget = null;
    state.coins = (state.coins || 0) + won;
    lsSet('qc_coins', String(state.coins));
    setSpinsUsedToday(used + 1);
    state.roulettePhase = null;
    state.rouletteResult = won;
    render();
    if (state.rouletteResultTimeout) clearTimeout(state.rouletteResultTimeout);
    state.rouletteResultTimeout = setTimeout(function(){ state.rouletteResult = null; render(); }, 4000);
  }

  // The per-league shop: things tied to THIS league rather than to your
  // account. No app currency here. Every group gets ONE free unlock via a
  // collective video watch (the whole group watches, gratis) — usable on
  // whichever themed league they try to unlock first. Once that free
  // unlock has been used, every remaining/future themed league only offers
  // the 0.99€-per-group payment. "Premium del grupo" is the alternative to
  // paying per league — it also removes the ad slots (but not the optional
  // reward-ad extras for a wildcard or an extra question, those stay
  // either way).
  //
  // Themed leagues work like a monthly drop: two new ones go on sale each
  // month and the previous ones stop being sold — but a group that unlocked
  // one keeps it for good, so the catalogue never really shrinks for them.
  //
  // To put next month's pair on sale: drop two question files into preguntas/
  // and add two entries here with that month. Nothing else needs touching —
  // what's on sale is worked out from the date, and the unlock records in
  // meta/leagueUnlocks are what make an old league stay playable.
  //
  var LEAGUE_QUESTION_COUNT = 180;  // 30 días x 6, lo que trae cada liga temática
  var THEMED_LEAGUES = [
    { key: 'futbol', month: '2026-09', icon: '⚽', name: 'Liga de fútbol',
      desc: 'Un mes de preguntas solo de fútbol: mundiales, Champions, LaLiga, leyendas y estadios',
      file: 'preguntas/futbol.json' },
    { key: 'cine', month: '2026-09', icon: '🎬', name: 'Liga de cine y series',
      desc: 'Un mes de cine y televisión: clásicos, sagas, directores, Oscars y animación',
      file: 'preguntas/cine.json' }
  ];
  function currentMonthStr(){
    var d = new Date();
    var m = String(d.getMonth() + 1);
    return d.getFullYear() + '-' + (m.length < 2 ? '0' + m : m);
  }
  // A league your group has unlocked stays yours whatever month it is.
  function ownsThemedLeague(key){ return leagueUnlockProgress(key).unlocked; }
  // What the shop shows: everything you already own, plus this month's drop.
  // Past months you didn't buy simply aren't on the shelf any more.
  function themedLeaguesOnShelf(){
    var month = currentMonthStr();
    return THEMED_LEAGUES.filter(function(lg){
      return ownsThemedLeague(lg.key) || lg.month === month;
    });
  }
  // Question banks are fetched from their own JSON file next to index.html,
  // so a new month is a small upload rather than a new build of the app.
  function loadThemedQuestions(key, cb){
    var lg = null;
    THEMED_LEAGUES.forEach(function(x){ if (x.key === key) lg = x; });
    if (!lg) { cb(null); return; }
    state.themedBanks = state.themedBanks || {};
    if (state.themedBanks[key]) { cb(state.themedBanks[key]); return; }
    fetch(lg.file).then(function(r){ return r.json(); }).then(function(data){
      state.themedBanks[key] = data;
      cb(data);
    }).catch(function(e){ console.error('quizco themed questions error', e); cb(null); });
  }

  function leagueUnlockProgress(key){
    var members = state.members || [];
    var entry = (state.leagueUnlocks && state.leagueUnlocks[key]) || null;
    var watchers = (entry && entry.watchers) || {};
    var total = members.length;
    var watched = members.filter(function(m){ return !!watchers[m.playerId]; }).length;
    return {
      total: total,
      watched: watched,
      iWatched: !!watchers[state.playerId],
      unlocked: total > 0 && watched >= total
    };
  }

  // Whether this group has already spent its one free "unlock via video"
  // perk — once true, the video option stops showing on every league,
  // watched or not, and only the 0.99€ payment remains.
  function usedFreeLeagueUnlock(){
    return !!(state.leagueUnlocks && state.leagueUnlocks.usedFreeUnlock);
  }

  // Simulates watching the unlock video (no real ad SDK yet, same
  // placeholder pattern as the existing day-catchup and wildcard ads), then
  // records that this player watched it so the group's shared progress
  // updates for everyone via the live meta/leagueUnlocks listener. If this
  // watch is what completes the group (everyone's now watched), it also
  // marks the group's one free unlock as spent, for good, across every
  // themed league.
  function watchLeagueUnlockAd(key){
    if (!state.db || state.leagueUnlockWatching) return;
    state.leagueUnlockWatching = key;
    render();
    setTimeout(function(){
      state.leagueUnlockWatching = false;
      var ref = state.db.doc(gpath('meta/leagueUnlocks'));
      var membersRef = state.db.collection(gpath('members'));
      Promise.all([ref.get(), membersRef.get()]).then(function(results){
        var snap = results[0], memSnap = results[1];
        var data = (snap.exists && snap.data()) || {};
        var entry = data[key] || {};
        entry.watchers = entry.watchers || {};
        entry.watchers[state.playerId] = true;
        data[key] = entry;
        var totalMembers = memSnap.docs.length;
        var watchedCount = memSnap.docs.filter(function(d){ return entry.watchers[(d.data() || {}).playerId]; }).length;
        // the last member to watch completes it, and spends the group's one free unlock
        if (totalMembers > 0 && watchedCount >= totalMembers) data.usedFreeUnlock = true;
        return ref.set(data);
      }).catch(function(e){ console.error('quizco league unlock save error', e); }).then(function(){ render(); });
    }, 1400);
  }
