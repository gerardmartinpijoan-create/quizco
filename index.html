  function getJoinedLeagues(){

  function effectiveDateStr(hour){

  function bindLoginScreen(){
    var tabLogin = document.getElementById('authTabLogin');
    var tabSignup = document.getElementById('authTabSignup');
    if (tabLogin) tabLogin.addEventListener('click', function(){
      if (state.authMode !== 'login'){ state.authMode = 'login'; state.authError = null; render(); }
    });
    if (tabSignup) tabSignup.addEventListener('click', function(){
      if (state.authMode !== 'signup'){ state.authMode = 'signup'; state.authError = null; render(); }
    });
    var emailInput = document.getElementById('authEmailInput');
    var passInput = document.getElementById('authPasswordInput');
    var countryInput = document.getElementById('authCountryInput');
    var birthdayInput = document.getElementById('authBirthdayInput');
    if (emailInput) emailInput.addEventListener('input', function(){ state.authEmail = emailInput.value; });
    if (countryInput) countryInput.addEventListener('change', function(){ state.authCountry = countryInput.value; });
    if (birthdayInput) birthdayInput.addEventListener('input', function(){ state.authBirthday = birthdayInput.value; });
    function submit(){
      var email = emailInput ? emailInput.value : '';
      var pass = passInput ? passInput.value : '';
      if (state.authMode === 'signup') signUpWithEmail(email, pass, countryInput ? countryInput.value : '', birthdayInput ? birthdayInput.value : '');
      else signInWithEmail(email, pass);
    }
    if (passInput) passInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });
    if (birthdayInput) birthdayInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });
    var submitBtn = document.getElementById('authSubmitBtn');
    if (submitBtn) submitBtn.addEventListener('click', submit);
    var googleBtn = document.getElementById('googleSignInBtn');
    if (googleBtn) googleBtn.addEventListener('click', signInWithGoogle);
  }

  function signInWithEmail(email, password){
    if (!firebaseAuth || state.authLoading) return;
    email = (email || '').trim();
    if (!email || !password){ state.authError = 'Escribe tu correo y tu contraseña.'; render(); return; }
    state.authLoading = true;
    state.authError = null;
    render();
    firebaseAuth.signInWithEmailAndPassword(email, password).catch(function(e){
      console.error('quizco email sign-in error', e);
      state.authLoading = false;
      state.authError = authErrorMessage(e);
      render();
    });
    // On success, onAuthStateChanged (see initAuth) picks it up and moves the app forward.
  }

  function signUpWithEmail(email, password, country, birthday){
    if (!firebaseAuth || state.authLoading) return;
    email = (email || '').trim();
    country = (country || '').trim();
    birthday = (birthday || '').trim();
    if (!email || !password){ state.authError = 'Escribe tu correo y tu contraseña.'; render(); return; }
    if (password.length < 6){ state.authError = 'La contraseña debe tener al menos 6 caracteres.'; render(); return; }
    if (!country){ state.authError = 'Selecciona tu país.'; render(); return; }
    if (!birthday){ state.authError = 'Indica tu fecha de nacimiento.'; render(); return; }
    state.authLoading = true;
    state.authError = null;
    render();
    firebaseAuth.createUserWithEmailAndPassword(email, password).then(function(cred){
      var uid = cred && cred.user && cred.user.uid;
      if (uid && firestoreDb){
        firestoreDb.doc('users/' + uid).set({ email: email, country: country, birthday: birthday, createdAt: Date.now() }).catch(function(e){
          console.error('quizco save profile error', e);
        });
      }
    }).catch(function(e){
      console.error('quizco email sign-up error', e);
      state.authLoading = false;
      state.authError = authErrorMessage(e);
      render();
    });
  }

  // Google Identity Services (the accounts.google.com/gsi/client script) is
  // Google's own current library for "Sign in with Google". We use it —
  // instead of Firebase Auth's own signInWithPopup/signInWithRedirect — for
  // one specific reason: Firebase's popup/redirect flow relies on a bit of
  // storage being shared between this app's domain (github.io) and
  // Firebase's own auth domain (firebaseapp.com), and browsers with strict
  // tracking protection (Safari's ITP, and increasingly Chrome) silently
  // block that. That's exactly what was happening: the redirect completed
  // on Google's side, came back to the app, and quietly never finished
  // signing in. Google Identity Services gets us an access token directly
  // (no cross-domain storage involved), which we then hand to Firebase.
  var googleTokenClient = null;

  function ensureGoogleTokenClient(){
    if (googleTokenClient) return googleTokenClient;
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) return null;
    googleTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_WEB_CLIENT_ID,
      scope: 'openid email profile',
      callback: function(resp){
        if (resp && resp.access_token){
          finishGoogleSignIn(resp.access_token);
        } else {
          state.authLoading = false;
          state.authError = 'No se ha podido completar el inicio de sesión con Google.';
          render();
        }
      },
      error_callback: function(err){
        console.error('quizco google token client error', err);
        state.authLoading = false;
        // 'popup_closed': the person closed the account picker themselves —
        // not a real error, no need to alarm them with a message.
        if (!err || err.type !== 'popup_closed'){
          state.authError = 'No se ha podido completar el inicio de sesión con Google. Comprueba tu conexión e inténtalo de nuevo.';
        }
        render();
      }
    });
    return googleTokenClient;
  }

  function finishGoogleSignIn(accessToken){
    var credential = firebase.auth.GoogleAuthProvider.credential(null, accessToken);
    firebaseAuth.signInWithCredential(credential).catch(function(e){
      console.error('quizco google credential sign-in error', e);
      state.authLoading = false;
      state.authError = authErrorMessage(e);
      render();
    });
    // On success, onAuthStateChanged (see initAuth) picks it up and moves the app forward.
  }

  function signInWithGoogle(){
    if (!firebaseAuth || state.authLoading) return;
    if (!GOOGLE_WEB_CLIENT_ID || GOOGLE_WEB_CLIENT_ID === 'PON_AQUI_TU_ID_DE_CLIENTE_WEB'){
      state.authError = 'Falta configurar el ID de cliente web de Google (variable GOOGLE_WEB_CLIENT_ID al principio del archivo).';
      render();
      return;
    }
    var client = ensureGoogleTokenClient();
    if (!client){
      state.authError = 'No se ha podido cargar el inicio de sesión de Google. Comprueba tu conexión y recarga la página.';
      render();
      return;
    }
    state.authLoading = true;
    state.authError = null;
    render();
    client.requestAccessToken();
  }

  function buildSeries(allDocs){
    var byDay = {1:[],2:[],3:[],4:[],5:[],6:[]};
    var maxDay = 0;
    var playersMeta = {};
    allDocs.forEach(function(doc){
      if (byDay[doc.day]) byDay[doc.day].push(doc);
      if (doc.day > maxDay) maxDay = doc.day;
      var ts = Date.parse(doc.submittedAt) || 0;
      if (!playersMeta[doc.playerId]) playersMeta[doc.playerId] = { name: doc.playerName, firstTs: ts };
      else { playersMeta[doc.playerId].name = doc.playerName; if (ts < playersMeta[doc.playerId].firstTs) playersMeta[doc.playerId].firstTs = ts; }
    });
    if (maxDay === 0) return { series: [], maxDay: 0 };
    var pal = palette();
    var playerIds = Object.keys(playersMeta).sort(function(a,b){ return playersMeta[a].firstTs - playersMeta[b].firstTs; });
    var cum = {}; playerIds.forEach(function(pid){ cum[pid] = 0; });
    var series = playerIds.map(function(pid, idx){
      return { playerId: pid, name: playersMeta[pid].name, color: pal[idx % pal.length], points: [] };
    });
    for (var d=1; d<=maxDay; d++){
      var dayBoard = computeLeaderboard(byDay[d]);
      var totalsByPid = {};
      dayBoard.forEach(function(r){ totalsByPid[r.playerId] = r.total; });
      series.forEach(function(s){
        cum[s.playerId] += (totalsByPid[s.playerId] || 0);
        s.points.push({ day: d, value: cum[s.playerId] });
      });
    }
    return { series: series, maxDay: maxDay };
  }

  function renderChartSvg(built){
    var W = 340, H = 200, padL = 30, padR = 8, padT = 10, padB = 22;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var maxVal = 0;
    built.series.forEach(function(s){ s.points.forEach(function(p){ if (p.value > maxVal) maxVal = p.value; }); });
    var step = maxVal <= 50 ? 10 : (maxVal <= 150 ? 25 : 50);
    var niceMax = Math.max(step, Math.ceil((maxVal || 1) / step) * step);
    function xAt(day){ return built.maxDay <= 1 ? (padL + plotW/2) : (padL + (day-1)/(built.maxDay-1) * plotW); }
    function yAt(val){ return padT + plotH - (val / niceMax) * plotH; }

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';

    // gridlines + y labels
    [0, 0.5, 1].forEach(function(f){
      var val = Math.round(niceMax * f);
      var y = yAt(val);
      svg += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W-padR) + '" y2="' + y + '" style="stroke:var(--line);stroke-width:1;"/>';
      svg += '<text x="' + (padL-6) + '" y="' + (y+3) + '" text-anchor="end" font-size="9" style="fill:var(--ink-faint);" font-family="Work Sans, sans-serif">' + val + '</text>';
    });

    // x labels
    for (var d=1; d<=built.maxDay; d++){
      svg += '<text x="' + xAt(d) + '" y="' + (H-6) + '" text-anchor="middle" font-size="9" style="fill:var(--ink-faint);" font-family="Work Sans, sans-serif">D' + d + '</text>';
    }

    // lines
    built.series.forEach(function(s){
      var pts = s.points.map(function(p){ return xAt(p.day) + ',' + yAt(p.value); }).join(' ');
      svg += '<polyline points="' + pts + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    });

    // markers (+ larger invisible hit targets)
    built.series.forEach(function(s){
      s.points.forEach(function(p){
        var cx = xAt(p.day), cy = yAt(p.value);
        svg += '<circle cx="' + cx + '" cy="' + cy + '" r="14" fill="transparent" class="qcpt" data-name="' + esc(s.name) + '" data-day="' + p.day + '" data-value="' + p.value + '" style="cursor:pointer;"/>';
        svg += '<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="' + s.color + '" style="stroke:var(--surface);stroke-width:2;pointer-events:none;"/>';
      });
    });

    svg += '</svg>';
    return svg;
  }

  function computeDesempateBonus(answers){
    if (!answers || !answers.length) return {};
    var correct = answers.filter(function(a){ return a.correct; });
    if (!correct.length) return {};
    // Sort by time first, then by playerId as a deterministic tiebreaker so every
    // client (whose snapshot may list docs in a different order) computes the
    // exact same winner on an exact-timeMs tie.
    var sorted = correct.slice().sort(function(a,b){
      return a.timeMs - b.timeMs || (a.playerId < b.playerId ? -1 : (a.playerId > b.playerId ? 1 : 0));
    });
    var map = {};
    map[sorted[0].playerId] = DESEMPATE_BONUS;
    return map;
  }

      input.addEventListener('blur', function(){ state.chatFocused = false; });
      input.addEventListener('keydown', function(e){ if (e.key === 'Enter') send(); });

        try { input.setSelectionRange(len, len); } catch(e){}

          setReaction(btn.getAttribute('data-msgid'), btn.getAttribute('data-emoji'));

    var chips = document.querySelectorAll('.reactionchip');

    function startPress(msgId){
      if (!msgId) return;
      pressMoved = false;
      pressTimer = setTimeout(function(){
        if (!pressMoved){ state.chatReactionPickerFor = msgId; render(); }
      }, 500);
    }
    function cancelPress(){ if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; } }
    for (i = 0; i < msgEls.length; i++){
      (function(el){
        var msgId = el.getAttribute('data-msgid');
        el.addEventListener('mousedown', function(){ startPress(msgId); });
        el.addEventListener('touchstart', function(){ startPress(msgId); }, { passive: true });
        el.addEventListener('mouseup', cancelPress);
        el.addEventListener('mouseleave', cancelPress);
        el.addEventListener('touchend', cancelPress);
        el.addEventListener('touchmove', function(){ pressMoved = true; cancelPress(); }, { passive: true });
        el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
      })(msgEls[i]);
    }
    if (state.chatReactionPickerFor){
      setTimeout(function(){
        document.addEventListener('click', function closeReactionBar(e){
          if (!e.target.closest || !e.target.closest('.reactionbar')){
            state.chatReactionPickerFor = null;
            render();
          }
        }, { once: true });
      }, 0);
    }
  }

  function setReaction(msgId, emoji){
    if (!state.db || !msgId) return;
    var msg = (state.chatMessages || []).find(function(m){ return m.id === msgId; });
    var newReactions = Object.assign({}, (msg && msg.reactions) || {});
    if (newReactions[state.playerId] === emoji){
      delete newReactions[state.playerId];
    } else {
      newReactions[state.playerId] = emoji;
    }
    state.db.doc(gpath('chat/' + msgId)).update({ reactions: newReactions }).catch(function(e){
      console.error('quizco chat reaction error', e);
    });
    state.chatReactionPickerFor = null;
    render();
  }

  function searchGifs(query){
    if (!GIPHY_API_KEY || GIPHY_API_KEY === 'TU_GIPHY_KEY') { render(); return; }
    state.chatGifLoading = true;
    state.chatGifError = null;
    render();
    var endpoint = query
      ? 'https://api.giphy.com/v1/gifs/search?api_key=' + encodeURIComponent(GIPHY_API_KEY) + '&q=' + encodeURIComponent(query) + '&limit=24&rating=pg-13&lang=es'
      : 'https://api.giphy.com/v1/gifs/trending?api_key=' + encodeURIComponent(GIPHY_API_KEY) + '&limit=24&rating=pg-13';
    fetch(endpoint).then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(data){
      state.chatGifLoading = false;
      state.chatGifResults = (data.data || []).map(function(g){
        var imgs = g.images || {};
        var thumbImg = imgs.fixed_width_small || imgs.fixed_width || imgs.original || {};
        var fullImg = imgs.fixed_width || imgs.original || {};
        return { thumb: thumbImg.url, full: fullImg.url };
      }).filter(function(g){ return g.thumb && g.full; });
      render();
    }).catch(function(e){
      console.error('quizco giphy search error', e);
      state.chatGifLoading = false;
      state.chatGifError = 'No se han podido buscar GIFs ahora mismo.';
      render();
    });
  }

  function computeSeasonBadges(allDocs, desempateBonusMap){
    var byDay = {};
    allDocs.forEach(function(d){ (byDay[d.day] = byDay[d.day] || []).push(d); });
    var days = Object.keys(byDay).map(Number).sort(function(a,b){ return a-b; });
    if (!days.length) return null;

    var dayBoard = {};
    days.forEach(function(day){ dayBoard[day] = computeLeaderboard(byDay[day]); });

    var players = {};
    function ensure(pid, name){
      if (!players[pid]) players[pid] = {
        playerId: pid, playerName: name, totalPoints: 0, totalCorrect: 0, totalBonus: 0,
        daysPlayed: [], catCorrect: {}, catTotal: {}, dailyTotal: {}, plenoDays: []
      };
      return players[pid];
    }

    days.forEach(function(day){
      var qs = questionsForDay(day);
      dayBoard[day].forEach(function(row){
        var p = ensure(row.playerId, row.playerName);
        p.totalPoints += row.total;
        p.totalCorrect += row.correctCount;
        p.totalBonus += row.bonus;
        p.daysPlayed.push(day);
        p.dailyTotal[day] = row.total;
        if (row.correctCount === 6) p.plenoDays.push(day);
      });
      byDay[day].forEach(function(d){
        var p = ensure(d.playerId, d.playerName);
        (d.answers || []).forEach(function(a){
          var cat = qs[a.qi] ? qs[a.qi].cat : null;
          if (cat == null) return;
          p.catTotal[cat] = (p.catTotal[cat] || 0) + 1;
          if (a.correct) p.catCorrect[cat] = (p.catCorrect[cat] || 0) + 1;
        });
      });
    });

    var plist = Object.keys(players).map(function(k){ return players[k]; });
    if (!plist.length) return null;

    if (desempateBonusMap){
      plist.forEach(function(p){
        if (desempateBonusMap[p.playerId]) p.totalPoints += desempateBonusMap[p.playerId];
      });
    }

    function topBy(fn, filterFn){
      var scored = plist.filter(filterFn || function(){ return true; })
        .map(function(p){ return { p: p, v: fn(p) }; })
        .filter(function(s){ return s.v != null && isFinite(s.v); });
      if (!scored.length) return { value: null, winners: [] };
      var max = Math.max.apply(null, scored.map(function(s){ return s.v; }));
      return { value: max, winners: scored.filter(function(s){ return s.v === max; }).map(function(s){ return s.p; }) };
    }
    function minBy(fn, filterFn){
      var scored = plist.filter(filterFn || function(){ return true; })
        .map(function(p){ return { p: p, v: fn(p) }; })
        .filter(function(s){ return s.v != null && isFinite(s.v); });
      if (!scored.length) return { value: null, winners: [] };
      var min = Math.min.apply(null, scored.map(function(s){ return s.v; }));
      return { value: min, winners: scored.filter(function(s){ return s.v === min; }).map(function(s){ return s.p; }) };
    }
    function rankOnDay(p, day){
      var rows = dayBoard[day];
      if (!rows) return null;
      for (var i=0; i<rows.length; i++){ if (rows[i].playerId === p.playerId) return i; }
      return null;
    }

    var badges = [];

    var champ = topBy(function(p){ return p.totalPoints; });
    badges.push({ icon:'🏆', name:'Campeón de la liga', desc:'Más puntos acumulados en toda la temporada.', winners:champ.winners, value: champ.value!=null ? (champ.value+' pts') : null });

    var acc = topBy(function(p){ return p.totalCorrect; });
    badges.push({ icon:'🎯', name:'Punto de mira', desc:'Más respuestas acertadas en total.', winners:acc.winners, value: acc.value!=null ? (acc.value+' aciertos') : null });

    var speed = topBy(function(p){ return p.totalBonus; }, function(p){ return p.totalBonus > 0; });
    badges.push({ icon:'⚡', name:'Rayo', desc:'Más veces el más rápido en acertar una pregunta.', winners:speed.winners, value: speed.value!=null ? (speed.value+' veces') : null });

    function longestStreak(p){
      var set = {}; p.plenoDays.forEach(function(d){ set[d] = true; });
      var best = 0, cur = 0;
      for (var d=1; d<=6; d++){ if (set[d]) { cur++; if (cur>best) best=cur; } else cur = 0; }
      return best;
    }
    var streak = topBy(longestStreak, function(p){ return longestStreak(p) >= 2; });
    badges.push({ icon:'🔥', name:'Racha imparable', desc:'Más días seguidos con pleno de 6/6.', winners:streak.winners, value: streak.value!=null ? (streak.value+' días seguidos') : null });

    var specEntries = [];
    plist.forEach(function(p){
      Object.keys(p.catTotal).forEach(function(catIdx){
        var total = p.catTotal[catIdx];
        if (total < 2) return;
        var correct = p.catCorrect[catIdx] || 0;
        specEntries.push({ pct: correct/total, total: total, catIdx: catIdx, playerId: p.playerId, playerName: p.playerName });
      });
    });
    if (specEntries.length){
      var maxPct = Math.max.apply(null, specEntries.map(function(e){ return e.pct; }));
      if (maxPct > 0){
        var topPct = specEntries.filter(function(e){ return e.pct === maxPct; });
        var maxTotal = Math.max.apply(null, topPct.map(function(e){ return e.total; }));
        var topEntries = topPct.filter(function(e){ return e.total === maxTotal; });
        var winCat = topEntries[0].catIdx;
        var specWinners = topEntries.filter(function(e){ return e.catIdx === winCat; });
        badges.push({
          icon:'🧠', name:'Cerebrito de ' + CATS[winCat].name,
          desc:'Mejor porcentaje de aciertos en esta categoría.',
          winners: specWinners.map(function(e){ return { playerId: e.playerId, playerName: e.playerName }; }),
          value: Math.round(maxPct*100) + '%'
        });
      }
    }

    var remontada = topBy(function(p){
      var pdays = p.daysPlayed.slice().sort(function(a,b){ return a-b; });
      if (pdays.length < 2) return null;
      var r0 = rankOnDay(p, pdays[0]);
      var r1 = rankOnDay(p, pdays[pdays.length-1]);
      if (r0 == null || r1 == null) return null;
      return r0 - r1;
    }, function(p){ return p.daysPlayed.length >= 2; });
    if (remontada.value != null && remontada.value > 0){
      badges.push({ icon:'📈', name:'La Remontada', desc:'Mayor subida en la clasificación diaria entre su primer y último día jugado.', winners:remontada.winners, value:'+' + remontada.value + ' puestos' });
    }

    function podiumCount(p){
      var c = 0;
      p.daysPlayed.forEach(function(day){ var r = rankOnDay(p, day); if (r != null && r < 3) c++; });
      return c;
    }
    var podium = topBy(podiumCount, function(p){ return podiumCount(p) > 0; });
    badges.push({ icon:'🥉', name:'Asiduo al podio', desc:'Más días acabando entre los 3 primeros.', winners:podium.winners, value: podium.value!=null ? (podium.value+' días') : null });

    function stdDev(p){
      var vals = p.daysPlayed.map(function(d){ return p.dailyTotal[d]; });
      if (vals.length < 2) return null;
      var mean = vals.reduce(function(a,b){ return a+b; }, 0) / vals.length;
      var variance = vals.reduce(function(a,b){ return a + (b-mean)*(b-mean); }, 0) / vals.length;
      return Math.sqrt(variance);
    }
    var constancia = minBy(stdDev, function(p){ return p.daysPlayed.length >= 2; });
    badges.push({ icon:'🧊', name:'Constancia de hierro', desc:'La puntuación más regular día a día.', winners:constancia.winners, value: constancia.value!=null ? ('±' + constancia.value.toFixed(1) + ' pts') : null });

    function firstSubmitCount(p){
      var c = 0;
      p.daysPlayed.forEach(function(day){
        var docsOfDay = byDay[day];
        var earliest = docsOfDay.reduce(function(a,b){ return Date.parse(a.submittedAt) < Date.parse(b.submittedAt) ? a : b; });
        if (earliest.playerId === p.playerId) c++;
      });
      return c;
    }
    var madrugador = topBy(firstSubmitCount, function(p){ return firstSubmitCount(p) > 0; });
    badges.push({ icon:'🐤', name:'Madrugador', desc:'Más veces el primero en enviar sus respuestas del día.', winners:madrugador.winners, value: madrugador.value!=null ? (madrugador.value+' días') : null });

    var totalDays = days.length;
    var asistencia = plist.filter(function(p){ return p.daysPlayed.length === totalDays; });
    if (totalDays >= 2 && asistencia.length){
      badges.push({
        icon:'🎟️', name:'Pleno de asistencia', desc:'No se ha perdido ni un día de liga.',
        winners: asistencia.map(function(p){ return { playerId:p.playerId, playerName:p.playerName }; }),
        value: totalDays + '/' + totalDays + ' días'
      });
    }

    badges = badges.filter(function(b){ return b.winners && b.winners.length > 0; });

    var maxDay = days[days.length-1];
    var seasonComplete = maxDay === 6 && plist.every(function(p){ return p.daysPlayed.indexOf(6) !== -1; });

    return {
      days: days, maxDay: maxDay, seasonComplete: seasonComplete, badges: badges,
      champWinners: champ.winners, champTie: champ.winners.length > 1
    };
  }

  function computeLeaderboard(docs){
    var bonusMap = {};
    for (var qi=0; qi<6; qi++){
      var minTime = Infinity, winners = [];
      docs.forEach(function(d){
        var a = d.answers && d.answers[qi];
        if (a && a.correct){
          if (a.timeMs < minTime){ minTime = a.timeMs; winners = [d.playerId]; }
          else if (a.timeMs === minTime){ winners.push(d.playerId); }
        }
      });
      winners.forEach(function(pid){ bonusMap[pid] = (bonusMap[pid]||0) + 1; });
    }
    return docs.map(function(d){
      var bonus = bonusMap[d.playerId] || 0;
      return {
        playerId: d.playerId, playerName: d.playerName, correctCount: d.correctCount,
        bonus: bonus, total: d.correctCount*10 + bonus, totalTimeMs: d.totalTimeMs,
        isMe: d.playerId === state.playerId
      };
    }).sort(function(a,b){ return b.total - a.total || a.totalTimeMs - b.totalTimeMs; });
  }

  function computeStandings(allDocs){
    var byDay = {};
    (allDocs || []).forEach(function(d){ (byDay[d.day] = byDay[d.day] || []).push(d); });
    var players = {};
    Object.keys(byDay).forEach(function(day){
      computeLeaderboard(byDay[day]).forEach(function(row){
        var p = players[row.playerId] || (players[row.playerId] = { playerId: row.playerId, playerName: row.playerName, totalPoints: 0, daysPlayed: 0 });
        p.totalPoints += row.total;
        p.daysPlayed += 1;
        p.playerName = row.playerName;
      });
    });
    return Object.keys(players).map(function(k){ return players[k]; })
      .sort(function(a,b){ return b.totalPoints - a.totalPoints; });
  }

  function computeFullStandings(members, allDocs){
    var standings = computeStandings(allDocs);
    var byId = {};
    standings.forEach(function(s){ byId[s.playerId] = s; });
    var list = (members || []).map(function(m){
      var s = byId[m.playerId];
      return s
        ? { playerId: m.playerId, playerName: m.playerName, totalPoints: s.totalPoints, daysPlayed: s.daysPlayed }
        : { playerId: m.playerId, playerName: m.playerName, totalPoints: 0, daysPlayed: 0 };
    });
    standings.forEach(function(s){
      if (!list.some(function(l){ return l.playerId === s.playerId; })) list.push(s);
    });
    return list.sort(function(a,b){ return b.totalPoints - a.totalPoints || a.playerName.localeCompare(b.playerName); });
  }

  function computeSeasonRecap(allDocs){
    var totalAnswers = 0, totalCorrect = 0;
    var qStats = {};
    (allDocs || []).forEach(function(d){
      (d.answers || []).forEach(function(a){
        totalAnswers++;
        if (a.correct) totalCorrect++;
        var key = d.day + '_' + a.qi;
        var s = qStats[key] || (qStats[key] = { day: d.day, qi: a.qi, correct: 0, total: 0 });
        s.total++;
        if (a.correct) s.correct++;
      });
    });
    var hardest = null;
    Object.keys(qStats).forEach(function(k){
      var s = qStats[k];
      if (s.total < 2) return;
      var pct = s.correct / s.total;
      if (!hardest || pct < hardest.pct) hardest = { day: s.day, qi: s.qi, pct: pct };
    });
    var hardestQ = null;
    if (hardest){
      var hq = questionsForDay(hardest.day)[hardest.qi];
      if (hq) hardestQ = { text: hq.q, pct: Math.round(hardest.pct*100), day: hardest.day };
    }
    return { totalAnswers: totalAnswers, totalCorrect: totalCorrect, hardestQ: hardestQ };
  }

      + '<div class="center mt16"><a href="#" id="backFromLeaguesCreate" class="faint">← Volver</a></div>';
  }

  function leaguesJoinScreen(){
    return ''
      + '<div class="muted mb16" style="font-weight:800;">Unirme a otra liga</div>'
      + '<div class="card">'
      + '<input type="text" id="joinLeagueInput" placeholder="Código de liga" maxlength="8" style="text-transform:uppercase;text-align:center;font-weight:800;letter-spacing:0.08em;">'
      + '<button class="btn btn-brand mt16" id="confirmJoinLeagueBtn">Unirme</button>'
      + '</div>'
      + '<div class="center mt16"><a href="#" id="backFromLeaguesJoin" class="faint">← Volver</a></div>';
  }

  function activateLeague(id, opts){
    opts = opts || {};
    if (state.seasonMetaUnsub) { state.seasonMetaUnsub(); state.seasonMetaUnsub = null; }
    if (state.unsub) { state.unsub(); state.unsub = null; }
    teardownGroupListeners();
    if (state.wildcardTimeout) { clearTimeout(state.wildcardTimeout); state.wildcardTimeout = null; }
    if (state.catchupTimeout) { clearTimeout(state.catchupTimeout); state.catchupTimeout = null; }
    if (state.dayLockNoticeTimeout) { clearTimeout(state.dayLockNoticeTimeout); state.dayLockNoticeTimeout = null; }
    if (state.advanceTimeout) { clearTimeout(state.advanceTimeout); state.advanceTimeout = null; }
    stopQuizTimer();
    state.groupId = id;
    lsSet('qc_group', id);
    lsSet('qc_day', '1');
    addJoinedLeague(id, (opts.leagueName != null) ? opts.leagueName : undefined);
    state.pendingCreateHour = (opts.dailyResetHour != null) ? opts.dailyResetHour : null;
    state.pendingCreateName = (opts.leagueName != null) ? opts.leagueName : null;
    state.allDocs = null; state.members = null; state.chatMessages = null;
    state.desempateMeta = null; state.desempateAnswers = null; state.desempateStartTs = null;
    state.desempateSubmitting = false; state.desempateUnlocking = false;
    state.seasonMeta = null; state.season = 1; state.currentSeasonDay = 1; state.dailyResetHour = 0;
    state.leagueName = '';
    state.day = 1;
    state.submittedDoc = null; state.leaderboard = null; state.answers = {}; state.quizStarted = false;
    state.currentQ = 0; state.locked = false; state.checking = true;
    state.dbRetryCount = 0; state.dbRetryScheduled = false;
    state.dayLockNotice = null;
    state.view = 'home';
    state.leaguesStep = 'list';
    state.pendingCode = null;
    render();
    initDb();
  }

  function bindLeagues(){
    if (state.leaguesStep === 'create') return bindLeaguesCreate();
    if (state.leaguesStep === 'join') return bindLeaguesJoin();
    var rows = document.querySelectorAll('[data-league]');
    rows.forEach(function(r){
      r.addEventListener('click', function(){
        var id = r.getAttribute('data-league');
        if (id !== state.groupId) activateLeague(id);
      });
    });
    var createBtn = document.getElementById('createAnotherLeagueBtn');
    if (createBtn) createBtn.addEventListener('click', function(){ state.leaguesStep = 'create'; state.pendingCode = null; render(); });
    var joinBtn = document.getElementById('joinAnotherLeagueBtn');
    if (joinBtn) joinBtn.addEventListener('click', function(){ state.leaguesStep = 'join'; render(); });
    var back = document.getElementById('backFromLeagues');
    if (back) back.addEventListener('click', function(e){ e.preventDefault(); state.view = 'home'; render(); });
  }

  function bindLeaguesCreate(){
    var back = document.getElementById('backFromLeaguesCreate');
    if (back) back.addEventListener('click', function(e){ e.preventDefault(); state.leaguesStep = 'list'; render(); });
    var confirm = document.getElementById('confirmNewLeagueBtn');
    if (confirm) confirm.addEventListener('click', function(){
      var sel = document.getElementById('newLeagueHour');
      var nameInp = document.getElementById('newLeagueName');
      var hour = sel ? parseInt(sel.value, 10) : 9;
      var name = nameInp ? nameInp.value.trim().slice(0,30) : '';
      var code = state.pendingCode;
      activateLeague(code, { dailyResetHour: hour, leagueName: name });
    });
  }

  function bindLeaguesJoin(){
    var back = document.getElementById('backFromLeaguesJoin');
    if (back) back.addEventListener('click', function(e){ e.preventDefault(); state.leaguesStep = 'list'; render(); });
    var input = document.getElementById('joinLeagueInput');
    if (input) input.focus();
    var confirm = document.getElementById('confirmJoinLeagueBtn');
    function go(){
      var v = input.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!v) return;
      activateLeague(v);
    }
    if (confirm) confirm.addEventListener('click', go);
    if (input) input.addEventListener('keydown', function(e){ if (e.key==='Enter') go(); });
  }

  function bindMainScreen(){
    var settingsBtn = document.getElementById('settingsBtn');
    if (settingsBtn) settingsBtn.addEventListener('click', function(){ state.view = 'settings'; render(); });
    var switchLeagueLink = document.getElementById('switchLeagueLink');
    if (switchLeagueLink) switchLeagueLink.addEventListener('click', function(e){ e.preventDefault(); state.leaguesStep = 'list'; state.view = 'leagues'; render(); });
    var change = document.getElementById('changeName');
    if (change) change.addEventListener('click', function(e){
      e.preventDefault();
      teardownSessionListeners();
      state.playerName = '';
      state.view = 'home';
      state.allDocs = null;
      state.members = null;
      state.desempateMeta = null;
      state.desempateAnswers = null;
      state.desempateStartTs = null;
      state.desempateSubmitting = false;
      state.desempateUnlocking = false;
      state.chatMessages = null;
      lsSet('qc_name', '');
      render();
    });
    var tabHome = document.getElementById('tabHome');
    var tabQuiz = document.getElementById('tabQuiz');
    var tabRanking = document.getElementById('tabRanking');
    var tabChapas = document.getElementById('tabChapas');
    var tabChat = document.getElementById('tabChat');
    if (tabHome) tabHome.addEventListener('click', function(){ if (state.view!=='home') showHome(); });
    if (tabQuiz) tabQuiz.addEventListener('click', function(){ if (state.view!=='quiz') showQuiz(); });
    if (tabRanking) tabRanking.addEventListener('click', function(){ if (state.view!=='ranking') showRanking(); });
    if (tabChapas) tabChapas.addEventListener('click', function(){ if (state.view!=='chapas') showChapas(); });
    if (tabChat) tabChat.addEventListener('click', function(){ if (state.view!=='chat') showChat(); });
    if (state.view === 'home'){ bindHome(); return; }
    if (state.view === 'ranking'){ bindRanking(); return; }
    if (state.view === 'chapas'){ bindChapas(); return; }
    if (state.view === 'chat'){ bindChat(); return; }
    if (state.view === 'settings'){ bindSettings(); return; }
    if (state.view === 'leagues'){ bindLeagues(); return; }
    if (state.view === 'lobby'){ bindLobby(); return; }
    var pills = document.querySelectorAll('.daypill');
    pills.forEach(function(p){
      p.addEventListener('click', function(){
        var d = parseInt(p.getAttribute('data-day'), 10);
        var locked = p.getAttribute('data-locked') === '1';
        if (!locked){
          if (d === state.day) return;
          state.day = d;
          lsSet('qc_day', String(d));
          state.dayLockNotice = null;
          loadDay(d);
          return;
        }
        if (d === state.currentSeasonDay - 1){
          if (state.catchupLoading) return;
          state.catchupLoading = true;
          state.catchupTargetDay = d;
          state.dayLockNotice = null;
          render();
          state.catchupTimeout = setTimeout(function(){
            state.catchupTimeout = null;
            state.catchupLoading = false;
            state.catchupTargetDay = null;
            setDayCatchupUnlocked(d);
            state.day = d;
            lsSet('qc_day', String(d));
            loadDay(d);
          }, 1400);
          return;
        }
        state.dayLockNotice = d > state.currentSeasonDay
          ? 'Este día todavía no está disponible.'
          : 'Ya ha pasado — solo puedes recuperar el día de ayer viendo un vídeo.';
        if (state.dayLockNoticeTimeout) clearTimeout(state.dayLockNoticeTimeout);
        render();
        state.dayLockNoticeTimeout = setTimeout(function(){ state.dayLockNotice = null; render(); }, 2500);
      });
    });
    var startBtn = document.getElementById('startQuizBtn');
    if (startBtn) startBtn.addEventListener('click', function(){
      state.quizStarted = true;
      state.startTs = Date.now();
      state.qStartTs = Date.now();
      render();
    });
    var wildcardBtn = document.getElementById('wildcardBtn');
    if (wildcardBtn) wildcardBtn.addEventListener('click', function(){
      if (state.wildcardUsed || state.wildcardLoading) return;
      state.wildcardLoading = true;
      render();
      var forDay = state.day, forQ = state.currentQ;
      state.wildcardTimeout = setTimeout(function(){
        state.wildcardTimeout = null;
        // Abort if the player has moved on (changed day/question) or already
        // answered this question while the "ad" was playing.
        if (state.day !== forDay || state.currentQ !== forQ || state.answers[forQ] != null){
          state.wildcardLoading = false;
          render();
          return;
        }
        var qs = questionsForDay(state.day);
        var q = qs[state.currentQ];
        var wrongIdx = [0,1,2,3].filter(function(oi){ return oi !== q.correct; });
        wrongIdx.sort(function(){ return Math.random() - 0.5; });
        state.wildcardHidden = wrongIdx.slice(0, 2);
        state.wildcardUsed = true;
        state.wildcardLoading = false;
        render();
      }, 1400);
    });
    var opts = document.querySelectorAll('.opt');
    opts.forEach(function(o){
      o.addEventListener('click', function(){
        if (state.locked) return;
        var qi = state.currentQ;
        var oi = parseInt(o.getAttribute('data-oi'), 10);
        state.answers[qi] = { choice: oi, timeMs: Date.now() - state.startTs };
        state.locked = true;
        render();
        if (state.wildcardTimeout) { clearTimeout(state.wildcardTimeout); state.wildcardTimeout = null; state.wildcardLoading = false; }
        var forDay = state.day, forSeason = state.season, forQ = qi;
        if (state.advanceTimeout) { clearTimeout(state.advanceTimeout); state.advanceTimeout = null; }
        state.advanceTimeout = setTimeout(function(){
          state.advanceTimeout = null;
          // Abort if the day/season moved on under us (e.g. a season restart
          // mid-quiz already reset currentQ/answers via loadDay()).
          if (state.day !== forDay || state.season !== forSeason || state.currentQ !== forQ) return;
          state.locked = false;
          state.wildcardHidden = null;
          if (state.currentQ < 5){
            state.currentQ++;
            state.qStartTs = Date.now();
            render();
          } else {
            submit();
          }
        }, 900);
      });
    });
    if (state.view === 'quiz' && state.quizStarted && !state.submittedDoc && !state.checking && !state.quizTimerInterval){
      startQuizTimer();
    }
  }

  function submit(){
    stopQuizTimer();
    var qs = questionsForDay(state.day);
    var answersArr = [];
    var correctCount = 0;
    var maxTime = 0;
    for (var i=0;i<6;i++){
      var a = state.answers[i];
      var correct = a.choice === qs[i].correct;
      if (correct) correctCount++;
      if (a.timeMs > maxTime) maxTime = a.timeMs;
      answersArr.push({ qi: i, choice: a.choice, correct: correct, timeMs: a.timeMs });
    }
    var doc = {
      day: state.day, playerId: state.playerId, playerName: state.playerName,
      answers: answersArr, correctCount: correctCount, totalTimeMs: maxTime,
      submittedAt: new Date().toISOString()
    };
    state.submittedDoc = doc;
    render();
    if (state.db){
      state.db.doc(spath('responses/' + state.day + '_' + state.playerId)).set(doc).catch(function(e){ console.error('quizco submit error', e); });
      subscribeLeaderboard(state.day);
    }
  }

  function enterStatsView(view){
    if (view !== 'lobby' && !state.seasonStarted) view = 'lobby';
    var wasInGroupView = state.view === 'home' || state.view === 'ranking' || state.view === 'chapas' || state.view === 'chat';
    state.view = view;
    stopQuizTimer();
    if (state.catchupTimeout) { clearTimeout(state.catchupTimeout); state.catchupTimeout = null; }
    state.catchupLoading = false;
    state.catchupTargetDay = null;
    if (state.dayLockNoticeTimeout) { clearTimeout(state.dayLockNoticeTimeout); state.dayLockNoticeTimeout = null; }
    state.dayLockNotice = null;
    // Note: state.advanceTimeout is deliberately NOT cancelled here. It carries
    // its own forDay/forSeason/forQ guard, so letting it fire in the background
    // while the player has switched tabs is safe and lets the final answer's
    // submit() (or a mid-quiz advance) still complete instead of being silently
    // discarded when the player returns to the quiz.
    if (!wasInGroupView){
      if (state.unsub) { state.unsub(); state.unsub = null; }
      state.allDocs = null;
    }
    render();
    if (!state.db) return;
    if (!state.rankingUnsub){
      state.rankingUnsub = state.db.collection(spath('responses')).onSnapshot(function(snap){
        state.allDocs = snap.docs.map(function(d){ return d.data(); });
        render();
      }, function(err){
        console.error('quizco stats error', err);
        if (err && err.code === 'permission-denied') retryDbInitOnce();
      });
    }
    if (!state.membersUnsub){
      state.membersUnsub = state.db.collection(gpath('members')).onSnapshot(function(snap){
        state.members = snap.docs.map(function(d){ return d.data(); });
        render();
      }, function(err){
        console.error('quizco members error', err);
        if (err && err.code === 'permission-denied') retryDbInitOnce();
      });
    }
    if (!state.desempateUnsub){
      state.desempateUnsub = state.db.doc(spath('desempate/main')).onSnapshot(function(snap){
        var wasUnlocked = state.desempateMeta && state.desempateMeta.unlocked;
        state.desempateMeta = snap.exists ? snap.data() : null;
        if (state.desempateMeta && state.desempateMeta.unlocked && !wasUnlocked && !state.desempateStartTs){
          state.desempateStartTs = Date.now();
        }
        render();
      }, function(err){
        console.error('quizco desempate meta error', err);
        if (err && err.code === 'permission-denied') retryDbInitOnce();
      });
    }
    if (!state.desempateAnswersUnsub){
      state.desempateAnswersUnsub = state.db.collection(spath('desempateAnswers')).onSnapshot(function(snap){
        state.desempateAnswers = snap.docs.map(function(d){ return d.data(); });
        render();
      }, function(err){
        console.error('quizco desempate answers error', err);
        if (err && err.code === 'permission-denied') retryDbInitOnce();
      });
    }
    if (!state.chatUnsub){
      state.chatUnsub = state.db.collection(gpath('chat')).onSnapshot(function(snap){
        state.chatMessages = snap.docs.map(function(d){ var data = d.data() || {}; data.id = d.id; return data; });
        render();
      }, function(err){
        console.error('quizco chat error', err);
        if (err && err.code === 'permission-denied') retryDbInitOnce();
      });
    }
  }

  function showRanking(){ enterStatsView('ranking'); }
  function showChapas(){ enterStatsView('chapas'); }
  function showChat(){ enterStatsView('chat'); }

  function teardownGroupListeners(){
    if (state.rankingUnsub) { state.rankingUnsub(); state.rankingUnsub = null; }
    if (state.membersUnsub) { state.membersUnsub(); state.membersUnsub = null; }
    if (state.desempateUnsub) { state.desempateUnsub(); state.desempateUnsub = null; }
    if (state.desempateAnswersUnsub) { state.desempateAnswersUnsub(); state.desempateAnswersUnsub = null; }
    if (state.chatUnsub) { state.chatUnsub(); state.chatUnsub = null; }
  }

  // Shared cleanup for "change name" and "sign out": tears down every live
  // Firestore listener and pending timer for the current session so nothing
  // keeps running (or fires a stray render()) against a session that's about
  // to be abandoned.
  function teardownSessionListeners(){
    if (state.unsub) { state.unsub(); state.unsub = null; }
    if (state.seasonMetaUnsub) { state.seasonMetaUnsub(); state.seasonMetaUnsub = null; }
    teardownGroupListeners();
    if (state.wildcardTimeout) { clearTimeout(state.wildcardTimeout); state.wildcardTimeout = null; }
    if (state.catchupTimeout) { clearTimeout(state.catchupTimeout); state.catchupTimeout = null; }
    if (state.dayLockNoticeTimeout) { clearTimeout(state.dayLockNoticeTimeout); state.dayLockNoticeTimeout = null; }
    if (state.advanceTimeout) { clearTimeout(state.advanceTimeout); state.advanceTimeout = null; }
    state.catchupLoading = false;
    state.catchupTargetDay = null;
    state.dayLockNotice = null;
    stopQuizTimer();
  }

  function showHome(){ enterStatsView('home'); }

  function showQuiz(){
    state.view = 'quiz';
    teardownGroupListeners();
    loadDay(state.day);
  }

  function loadDay(day){
    stopQuizTimer();
    state.checking = true;
    state.submittedDoc = null;
    state.leaderboard = null;
    state.answers = {};
    state.quizStarted = false;
    state.qStartTs = null;
    state.currentQ = 0;
    state.locked = false;
    if (state.wildcardTimeout) { clearTimeout(state.wildcardTimeout); state.wildcardTimeout = null; }
    state.wildcardUsed = false;
    state.wildcardHidden = null;
    state.wildcardLoading = false;
    if (state.catchupTimeout) { clearTimeout(state.catchupTimeout); state.catchupTimeout = null; }
    state.catchupLoading = false;
    state.catchupTargetDay = null;
    if (state.dayLockNoticeTimeout) { clearTimeout(state.dayLockNoticeTimeout); state.dayLockNoticeTimeout = null; }
    state.dayLockNotice = null;
    if (state.advanceTimeout) { clearTimeout(state.advanceTimeout); state.advanceTimeout = null; }
    if (state.unsub) { state.unsub(); state.unsub = null; }
    render();
    if (!state.db){
      state.checking = false;
      render();
      return;
    }
    state.db.doc(spath('responses/' + day + '_' + state.playerId)).get().then(function(snap){
      if (state.day !== day || state.view !== 'quiz') return;
      state.checking = false;
      if (snap.exists){
        state.submittedDoc = snap.data();
        subscribeLeaderboard(day);
      }
      render();
    }).catch(function(e){
      console.error('quizco load error', e);
      if (e && e.code === 'permission-denied' && retryDbInitOnce()) return;
      state.checking = false;
      render();
    });
  }

  function subscribeLeaderboard(day){
    if (!state.db) return;
    if (state.unsub) { state.unsub(); state.unsub = null; }
    state.unsub = state.db.collection(spath('responses')).where('day','==',day).onSnapshot(function(snap){
      state.leaderboard = snap.docs.map(function(d){ return d.data(); });
      render();
    }, function(err){
      console.error('quizco leaderboard error', err);
      if (err && err.code === 'permission-denied') retryDbInitOnce();
    });
  }

  function registerMember(){
    if (!state.db) return;
    var ref = state.db.doc(gpath('members/' + state.playerId));
    ref.get().then(function(snap){
      if (!snap.exists){
        return ref.set({ playerId: state.playerId, playerName: state.playerName, joinedAt: new Date().toISOString() });
      }
      if (snap.data().playerName !== state.playerName){
        return ref.set({ playerId: state.playerId, playerName: state.playerName, joinedAt: snap.data().joinedAt || new Date().toISOString() });
      }
    }).catch(function(e){
      console.error('quizco member register error', e);
      if (e && e.code === 'permission-denied') retryDbInitOnce();
    });
  }

  function computeCurrentSeasonDay(){
    return state.seasonMeta
      ? Math.min(6, Math.max(1, daysBetween(effectiveDateStr(state.dailyResetHour), state.seasonMeta.startDate) + 1))
      : 1;
  }

  // Per-league config (currently just the daily reset hour) lives in its own
  // doc, separate from meta/season, because it must survive season restarts.
  // Leagues created before this feature have no such doc — they default to
  // hour 0 (midnight), which is the behavior they already had.
  function loadGroupConfig(cb){
    if (!state.db) { cb(); return; }
    var ref = state.db.doc(gpath('meta/config'));
    ref.get().then(function(snap){
      if (snap.exists){
        var data = snap.data();
        state.dailyResetHour = (data.dailyResetHour != null) ? data.dailyResetHour : 0;
        state.leagueName = data.leagueName || '';
        state.leagueCreatedBy = data.createdBy || null;
      } else if (state.pendingCreateHour != null || (state.pendingCreateName != null && state.pendingCreateName !== '')){
        state.dailyResetHour = (state.pendingCreateHour != null) ? state.pendingCreateHour : 0;
        state.leagueName = state.pendingCreateName || '';
        state.leagueCreatedBy = state.playerId;
        ref.set({ dailyResetHour: state.dailyResetHour, leagueName: state.leagueName, createdBy: state.playerId }).catch(function(e){ console.error('quizco config set error', e); });
      } else {
        state.dailyResetHour = 0;
        state.leagueName = '';
        state.leagueCreatedBy = null;
      }
      addJoinedLeague(state.groupId, state.leagueName);
      state.pendingCreateHour = null;
      state.pendingCreateName = null;
      cb();
    }).catch(function(e){
      console.error('quizco config get error', e);
      if (e && e.code === 'permission-denied' && retryDbInitOnce()) return;
      state.dailyResetHour = (state.dailyResetHour != null) ? state.dailyResetHour : 0;
      state.leagueName = state.leagueName || '';
      cb();
    });
  }

  function subscribeSeasonMeta(cb){
    if (!state.db) { cb(); return; }
    if (state.seasonMetaUnsub) { cb(); return; }
    var ref = state.db.doc(gpath('meta/season'));

    function applySnapshotData(data){
      state.seasonMeta = data;
      state.season = data.seasonNumber || 1;
      state.seasonStarted = (data.started !== false);
      state.currentSeasonDay = computeCurrentSeasonDay();
    }

    // Resolve the INITIAL value with a plain one-shot get(), exactly like the
    // single-season build did — this is guaranteed to resolve regardless of
    // whether the doc (or even the artifact's whole database) exists yet, so
    // the app can never get stuck on "Cargando…" waiting for a first
    // onSnapshot delivery that, on a brand-new/empty store, may be delayed.
    // onSnapshot is layered on top afterwards purely to catch a season
    // restart from ANOTHER client while we stay connected.
    ref.get().then(function(snap){
      if (snap.exists){
        applySnapshotData(snap.data());
      } else {
        // Brand-new league: don't auto-start it. It sits unstarted (no
        // startDate yet) until whoever created it presses "Iniciar liga" —
        // see startLeague(). Leagues created before this feature already
        // have a meta/season doc with a startDate and no `started` field,
        // so applySnapshotData's `!== false` check treats them as already
        // started and they never hit this branch.
        state.season = 1;
        state.seasonStarted = false;
        state.seasonMeta = { seasonNumber: 1, started: false };
        state.currentSeasonDay = 1;
        ref.set(state.seasonMeta).catch(function(e){ console.error('quizco season meta set error', e); });
      }
      state.day = state.currentSeasonDay;
      cb();

      var first = true;
      state.seasonMetaUnsub = ref.onSnapshot(function(snap2){
        if (!snap2.exists) return; // still seeding, or a stale delivery — get() above already covered us
        var prevSeason = state.season;
        var prevStarted = state.seasonStarted;
        applySnapshotData(snap2.data());
        if (first){ first = false; return; }
        if (prevSeason !== state.season || (!prevStarted && state.seasonStarted)){
          // Someone started a new season (or just started the league for the
          // first time) while we were connected — jump everyone there.
          state.day = state.currentSeasonDay;
          state.allDocs = null;
          state.desempateMeta = null;
          state.desempateAnswers = null;
          state.desempateStartTs = null;
          state.desempateSubmitting = false;
          state.desempateUnlocking = false;
          var targetView = (state.view === 'lobby') ? 'home' : state.view;
          if (targetView === 'quiz'){
            loadDay(state.day);
          } else {
            teardownGroupListeners();
            enterStatsView(targetView);
          }
        } else {
          render();
        }
      }, function(err){
        console.error('quizco season meta error', err);
      });
    }).catch(function(e){
      console.error('quizco season meta get error', e);
      if (e && e.code === 'permission-denied' && retryDbInitOnce()) return;
      state.season = 1;
      state.seasonStarted = true;
      state.currentSeasonDay = computeCurrentSeasonDay();
      state.day = state.currentSeasonDay;
      cb();
    });
  }

  function startNewSeason(){
    if (!state.db || state.seasonStarting) return;
    state.seasonStarting = true;
    render();
    var nextSeason = state.season + 1;
    state.db.doc(gpath('meta/season')).set({ startDate: effectiveDateStr(state.dailyResetHour), seasonNumber: nextSeason }).then(function(){
      return state.db.doc(gpath('chat/sys_' + Date.now())).set({
        system: true, text: state.playerName + ' ha empezado la temporada ' + nextSeason + ' 🎉',
        ts: new Date().toISOString()
      });
    }).catch(function(e){
      console.error('quizco start season error', e);
    }).then(function(){
      state.seasonStarting = false;
      // The live meta/season listener will pick up the change and jump the view itself.
      render();
    });
  }

  // Firestore's web SDK can transiently answer the very first burst of
  // requests right after firebase.firestore() is constructed with
  // "permission-denied", even though the rules are wide open — an internal
  // startup race (IndexedDB/persistence/credential setup), not a real rules
  // problem: identical calls made a bit later against the same instance
  // succeed. How long that takes varies with the device, so instead of one
  // fixed-delay retry we back off across a few attempts (0.5s, 1s, 2s, 4s)
  // before giving up. Every initial subscription/get routes its
  // permission-denied error here; the several that fail together from the
  // same burst share one scheduled retry (dbRetryScheduled) instead of each
  // queuing their own.
  var DB_RETRY_DELAYS_MS = [500, 1000, 2000, 4000];
  function retryDbInitOnce(){
    if (state.dbRetryScheduled) return true;
    if (state.dbRetryCount >= DB_RETRY_DELAYS_MS.length) return false;
    var delay = DB_RETRY_DELAYS_MS[state.dbRetryCount];
    state.dbRetryCount++;
    state.dbRetryScheduled = true;
    if (state.seasonMetaUnsub) { state.seasonMetaUnsub(); state.seasonMetaUnsub = null; }
    if (state.unsub) { state.unsub(); state.unsub = null; }
    teardownGroupListeners();
    setTimeout(function(){ state.dbRetryScheduled = false; initDb(); }, delay);
    return true;
  }

  function initDb(){
    if (!firestoreDb){ state.checking = false; render(); return; }
    state.db = firestoreDb;
    registerMember();
    loadGroupConfig(function(){
      subscribeSeasonMeta(function(){
        if (!state.seasonStarted){
          enterStatsView('lobby');
        } else if (state.view === 'quiz') {
          loadDay(state.day);
        } else {
          enterStatsView(state.view);
        }
      });
    });
  }

  function initAuth(){
    if (!firebaseAuth){
      // Firebase itself failed to load/init (see DB_INIT_ERROR) — nothing to
      // gate on, so don't block the app behind a login screen that could
      // never be completed.
      state.authChecked = true;
      render();
      if (state.groupId && state.playerName) setTimeout(initDb, 250);
      return;
    }
    function attachAuthListener(){
      firebaseAuth.onAuthStateChanged(function(user){
        var wasChecked = state.authChecked;
        state.authChecked = true;
        state.authLoading = false;
        if (user){
          state.authUser = { uid: user.uid, displayName: user.displayName || '', photoURL: user.photoURL || '' };
          state.playerId = user.uid;
          lsSet('qc_pid', user.uid);
        } else {
          state.authUser = null;
        }
        render();
        // Returning visitor who was already signed in and already had a
        // league + name picked from a previous session: resume straight into
        // the game. A brand-new sign-in mid-session instead flows through
        // onboarding/nameScreen, which call initDb() themselves once ready.
        if (!wasChecked && state.authUser && state.groupId && state.playerName){
          setTimeout(initDb, 250);
        }
      }, function(err){
        console.error('quizco auth state error', err);
        state.authChecked = true;
        render();
      });
    }
    // Surface any error from a just-completed Google redirect (e.g. the
    // domain not being authorized yet) before the ordinary listener below
    // takes over — otherwise a failed redirect looks like nothing happened.
    firebaseAuth.getRedirectResult().catch(function(e){
      console.error('quizco google redirect result error', e);
      state.authError = authErrorMessage(e);
    }).then(attachAuthListener, attachAuthListener);
  }

  render();
  initAuth();
})();
</script>

</body>
</html>
